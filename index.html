        /* 核心修復：徹底禁用 Android WebView 系統內建的下拉重新整理 (Pull-to-refresh) 手勢 */
        html, body, #root {
            overscroll-behavior-y: none;
            overscroll-behavior: none;
            height: 100%;
            width: 100%;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInFromTop { from { transform: translate(-50%, -100%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        @keyframes slideInFromBottom { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes slideInFromBottom4 { from { transform: translateY(1rem); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-in { animation-duration: 250ms; animation-fill-mode: both; animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
        .fade-in { animation-name: fadeIn; }
        .slide-in-from-top { animation-name: slideInFromTop; }
        .slide-in-from-bottom { animation-name: slideInFromBottom; }
        .slide-in-from-bottom-4 { animation-name: slideInFromBottom4; }
        
        /* 隱藏滾動條但保持功能 (回歸乾淨書卷體驗) */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

        // --- 智慧音譯引擎 ---
        const autoTransliterate = (text, isHebrew) => {
          if (!text) return '';
          if (isHebrew) {
            let t = text.replace(/[\u0591-\u05AF\u05C4\u05C5]/g, ''); 
            t = t.replace(/ו\u05BC/g, 'u');
            t = t.replace(/\u05B4\u05D9/g, 'i');
            t = t.replace(/\u05B5\u05D9/g, 'e');
            t = t.replace(/\u05B6\u05D9/g, 'e');
            t = t.replace(/\u05B9\u05D5/g, 'o');
            t = t.replace(/\u05B8\u05D4(?:$|[^\u0590-\u05FF])/g, 'ah');
            t = t.replace(/\u05B7\u05D4(?:$|[^\u0590-\u05FF])/g, 'ah');
            t = t.replace(/א/g, '');

            const basicMap = {
                'ג':'g', 'ד':'d', 'ה':'h', 'ו':'v', 'ז':'z', 'ח':'ch', 'ט':'t', 'י':'y', 
                'ל':'l', 'מ':'m', 'ם':'m', 'נ':'n', 'ן':'n', 'ס':'s', 'ע':'‘', 'צ':'ts', 
                'ץ':'ts', 'ק':'q', 'ר':'r', 'ת':'t',
                '\u05B0':'e', '\u05B1':'e', '\u05B2':'a', '\u05B3':'o', '\u05B4':'i', 
                '\u05B5':'e', '\u05B6':'e', '\u05B7':'a', '\u05B8':'a', '\u05B9':'o', 
                '\u05BB':'u'
            };

            let res = '';
            for (let i = 0; i < t.length; i++) {
                let char = t[i];
                let lookahead = t.substring(i + 1, i + 3);
                let hasDagesh = lookahead.includes('\u05BC');

                if (char === 'ב') { res += hasDagesh ? 'b' : 'v'; }
                else if (char === 'פ' || char === 'ף') { res += hasDagesh ? 'p' : 'f'; }
                else if (char === 'כ' || char === 'ך') { res += hasDagesh ? 'k' : 'ch'; }
                else if (char === 'ש') { res += lookahead.includes('\u05C2') ? 's' : 'sh'; }
                else if (basicMap[char]) { res += basicMap[char]; }
                else if (/[a-zA-Z‘]/.test(char)) { res += char; } 
            }
            if (res.length > 0) res = res.charAt(0).toUpperCase() + res.slice(1);
            return res || '-';
            
          } else {
            const charMap = {'α':'a', 'β':'b', 'γ':'g', 'δ':'d', 'ε':'e', 'ζ':'z', 'η':'ē', 'θ':'th', 'ι':'i', 'κ':'k', 'λ':'l', 'μ':'m', 'ν':'n', 'ξ':'x', 'ο':'o', 'π':'p', 'ρ':'r', 'σ':'s', 'ς':'s', 'τ':'t', 'υ':'y', 'φ':'ph', 'χ':'ch', 'ψ':'ps', 'ω':'ō'};
            let res = text.toLowerCase().normalize("NFD").split('').map(c => charMap[c] || c).join('').replace(/[\u0300-\u036f]/g, "").replace(/[^a-zōē\s]/g, '');
            if (res.length > 0) res = res.charAt(0).toUpperCase() + res.slice(1);
            return res;
          }
        };

        const removeDiacritics = (str) => {
            if (!str) return '';
            return str.normalize("NFD").replace(/[\u0300-\u036f\u0591-\u05C7]/g, "").toLowerCase();
        };

        // --- IndexedDB 控制 ---
        const DB_NAME = 'BibleManuscriptDB';
        const STORE_NAME = 'bibles';

        const initDB = () => new Promise((resolve, reject) => {
            try {
                const request = indexedDB.open(DB_NAME, 2);
                request.onupgradeneeded = (e) => {
                  const db = e.target.result;
                  if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error || new Error("資料庫權限遭系統攔截"));
            } catch (error) { reject(error); }
        });

        const saveToDB = async (id, data) => {
          const db = await initDB();
          return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).put({ id, data });
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
          });
        };

        const deleteFromDB = async (id) => {
          const db = await initDB();

        // --- JSON 解析正規化 ---
        const normalizeBibleData = (rawJson) => {

                bookMap[b.en.toUpperCase()] = b.id; bookMap[b.abbr.toUpperCase()] = b.id;
            });

            const ALIASES = {
              '1CHR': '1CH', '2CHR': '2CH', '1SAM': '1SA', '2SAM': '2SA', '1KGS': '1KI', '2KGS': '2KI', 
              'PSALM': 'PSA', 'SONG': 'SNG', 'CANTICLES': 'SNG', 'EZEK': 'EZK', 'MATT': 'MAT', 'MARK': 'MRK',
              'LUKE': 'LUK', 'JOHN': 'JHN', '1COR': '1CO', '2COR': '2CO', '1THESS': '1TH', '2THESS': '2TH', 
              '1TIM': '1TI', '2TIM': '2TI', 'PHILEM': 'PHM', 'HEB': 'HEB', 'JAMES': 'JAS', '1PET': '1PE',
              '2PET': '2PE', '1JOHN': '1JO', '2JOHN': '2JO', '3JOHN': '3JO', 'REV': 'REV',
              'GEN': 'GEN', 'EXO': 'EXO', 'LEV': 'LEV', 'NUM': 'NUM', 'DEU': 'DEU', 'JOSH': 'JSH', 'JUDG': 'JDG',
              'RUTH': 'RUT', 'EZRA': 'EZR', 'NEH': 'NEH', 'ESTH': 'EST', 'JOB': 'JOB', 'PROV': 'PRO', 'ECCL': 'ECC',
              'ISA': 'ISA', 'JER': 'JER', 'LAM': 'LAM', 'DAN': 'DAN', 'HOS': 'HOS', 'JOEL': 'JOL', 'AMOS': 'AMO',
              'OBAD': 'OBA', 'JONAH': 'JON', 'MIC': 'MIC', 'NAHUM': 'NAM', 'HAB': 'HAB', 'ZEPH': 'ZEP', 'HAG': 'HAG',
              'ZECH': 'ZEC', 'MAL': 'MAL'
            };
            
            // 輔助函數：從 "1Chr.1.1" 這種格式中提取章節
            const parseVerseRef = (refStr) => {
                if (!refStr) return null;
                const parts = refStr.split('.');
                if (parts.length >= 3) {
                    return { bookAbbr: parts[0], chapter: parseInt(parts[1]), verse: parseInt(parts[2]) };
                }
                return null;
            };

            const getBookId = (name) => {
                if (!name) return null;
                let n = String(name).trim(); let upper = n.toUpperCase();
                if (ALIASES[upper]) return ALIASES[upper]; if (bookMap[n]) return bookMap[n]; if (bookMap[upper]) return bookMap[upper];
                const found = allBooks.find(b => b.name === n || b.en.toUpperCase() === upper || b.abbr.toUpperCase() === upper);
                return found ? found.id : null;
            };

            const ensurePath = (bId, ch) => { if(!result[bId]) result[bId] = {}; if(!result[bId][ch]) result[bId][ch] = {}; };

            try {
                // 處理 Object 格式的資料
                if (rawJson && typeof rawJson === 'object' && !Array.isArray(rawJson)) {
                    
                    const firstKey = Object.keys(rawJson)[0];
                    if (!firstKey) return result;

                    // 🆕 支援新約 NA28 的平坦結構： { "Mat.1.1": [ { "word": "...", ... } ] }
                    if (firstKey.includes('.') && Array.isArray(rawJson[firstKey])) {
                        for (const verseRef in rawJson) {
                            const ref = parseVerseRef(verseRef);
                            if (ref) {
                                const bId = getBookId(ref.bookAbbr);
                                if (bId) {
                                    ensurePath(bId, ref.chapter);
                                    // 儲存整個 words 陣列，這樣之後點擊單字時才能拿到完整物件 (包含 gloss/english)
                                    result[bId][ref.chapter][ref.verse] = rawJson[verseRef];
                                }
                            }
                        }
                        return result;
                    }

                    // 支援舊約 WLC 的階層結構： { "1Chr": [ { "verse": "1Chr.1.1", "words": [...] } ] }
                    if (Array.isArray(rawJson[firstKey]) && rawJson[firstKey][0] && rawJson[firstKey][0].verse && rawJson[firstKey][0].words) {
                        for (const bookKey in rawJson) {
                            const bId = getBookId(bookKey);

                    });

                  rawJson.forEach(bookData => {

                }
                
            } catch (e) { console.error("解析錯誤:", e); }

        };

            if (rawCodeOrObj && rawCodeOrObj.morphology && typeof rawCodeOrObj.morphology === 'string' && rawCodeOrObj.morphology.includes('=')) {
                rawCodeOrObj.morphology.split(';').forEach(part => {
                    const cleanPart = part.trim();
                    if (cleanPart) {
                        const [key, val] = cleanPart.split('=');
                        if (key && val) {
                            // 英文文法標籤對應繁體中文
                            const transMap = {
                                'Function': '功能', 'Verb': '動詞', 'Noun': '名詞', 'Adjective': '形容詞', 'Conjunction': '連接詞', 'Article': '冠詞', 'Preposition': '介系詞', 'Interjection': '感嘆詞', 'Particle': '助詞', 'Pronoun': '代名詞', 'Relative pronoun': '關係代名詞', 'Definite article': '定冠詞', 'Personal pronoun': '人稱代名詞', 'Demonstrative pronoun': '指示代名詞', 'Reflexive pronoun': '反身代名詞', 'Interrogative pronoun': '疑問代名詞', 'Possessive pronoun': '所有格代名詞', 'Particle or Disjunctive': '助詞/反義詞',
                                'Tense': '時態', 'Present': '現在式', 'Aorist': '不定過去式', 'Imperfect': '未完成式', 'Perfect': '完成式', 'Future': '未來式', 'Pluperfect': '過去完成式', '2nd Aorist': '第二不定過去式', '2nd Future': '第二未來式',
                                'Voice': '語態', 'Active': '主動', 'Passive': '被動', 'Middle': '關身', 'Middle Deponent': '關身異態', 'Passive Deponent': '被動異態', 'Middle or Passive Deponent': '關/被異態', 'Middle or Passive': '關身或被動',
                                'Mood': '語氣', 'Indicative': '直陳', 'Subjunctive': '假設', 'Imperative': '祈使', 
                                'Form': '形式', 'Participle': '分詞', 'Infinitive': '不定詞',
                                'Person': '人稱', '1st': '第一', '2nd': '第二', '3rd': '第三',
                                'Number': '單複', 'Singular': '單數', 'Plural': '複數',
                                'Case': '格位', 'Nominative': '主格', 'Genitive': '屬格', 'Dative': '與格', 'Accusative': '賓格', 'Vocative': '呼格',
                                'Gender': '性別', 'Masculine': '陽性', 'Feminine': '陰性', 'Neuter': '中性',

                            };
                            const transKey = transMap[key.trim()] || key.trim();
                            const transVal = transMap[val.trim()] || val.trim();

                        } else {

                if (rawCodeOrObj.pos && !rawCodeOrObj.morphology.includes('Function=')) addTag(`詞性: ${rawCodeOrObj.pos}`);

                    };
                    if (part.pos && posMap[part.pos.toLowerCase()]) addTag(`詞性: ${posMap[part.pos.toLowerCase()]}`);

                    const genderMap = { 'masculine': '陽性', 'feminine': '陰性', 'common': '通性' };
                    if (part.gender && genderMap[part.gender.toLowerCase()]) addTag(genderMap[part.gender.toLowerCase()]);
                    else if (part.gender) addTag(part.gender);

                    const numMap = { 'singular': '單數', 'plural': '複數', 'dual': '雙數' };
                    if (part.number && numMap[part.number.toLowerCase()]) addTag(numMap[part.number.toLowerCase()]);
                    else if (part.number) addTag(part.number);

                    const stateMap = { 'absolute': '絕對態', 'construct': '附屬態' };
                    if (part.state && stateMap[part.state.toLowerCase()]) addTag(stateMap[part.state.toLowerCase()]);

                    const stemMap = {
                        'qal': 'Qal(輕)', 'niphal': 'Niphal(被動)', 'piel': 'Piel(強調)', 
                        'pual': 'Pual(強被)', 'hiphil': 'Hiphil(使役)', 'hophal': 'Hophal(使被)', 'hithpael': 'Hithpael(反身)'
                    };
                    if (part.stem && stemMap[part.stem.toLowerCase()]) addTag(`語幹: ${stemMap[part.stem.toLowerCase()]}`);

                    const conjMap = {
                        'perfect': '完成式', 'imperfect': '未完成式', 'sequential imperfect': '連續未完成式',
                        'imperative': '祈使語氣', 'infinitive construct': '附屬不定詞', 'infinitive absolute': '絕對不定詞',

                    if (part.person && personMap[part.person.toLowerCase()]) addTag(personMap[part.person.toLowerCase()]);

               posRaw = String(rawCodeOrObj.part_of_speech || rawCodeOrObj.pos || (rawCodeOrObj.morphology_detail && rawCodeOrObj.morphology_detail.pos) || '').trim();

        // --- 主元件 ---
        const App = () => {

          };

          const handleDeleteVersion = async (id, label) => {
              if (window.confirm(`確定要單獨刪除「${label}」的全部數據嗎？`)) {
                  try {
                      await deleteFromDB(id);
                      setLoadedBibles(prev => { const next = { ...prev }; delete next[id]; return next; });
                      setToastMsg(`🗑️ 已成功刪除：${label}`);
                  } catch (err) { setToastMsg(`❌ 刪除失敗：${err.message}`); }
                  setTimeout(() => setToastMsg(''), 2500);
              }
          };

          const loadChapter = useCallback(async () => {
            setFetching(true);
            const isDemo = Object.keys(loadedBibles).length === 0;
            let maxV = isDemo ? 5 : 1; 
            Object.values(loadedBibles).forEach(bible => {
                const bData = bible[viewState.bookId];
                if (bData && bData[viewState.chapter]) {
                    const vKeys = Object.keys(bData[viewState.chapter]).map(Number).filter(n => !isNaN(n));
                    if (vKeys.length > 0) maxV = Math.max(maxV, ...vKeys);
                }
            });

            const isOT = BIBLE_STRUCTURE.OT.some(b => b.id === viewState.bookId);
            const newVerses = [];
            for (let i = 1; i <= maxV; i++) {
                let cuv = loadedBibles['zh-cuv']?.[viewState.bookId]?.[viewState.chapter]?.[i];
                let wlc = loadedBibles['orig-wlc']?.[viewState.bookId]?.[viewState.chapter]?.[i];
                let na28 = loadedBibles['orig-na28']?.[viewState.bookId]?.[viewState.chapter]?.[i];
                newVerses.push({
                    verseNum: i, paragraphStart: i === 1, bookId: viewState.bookId, chapter: viewState.chapter,
                    chinese: { cuv: cuv || "", lzz: loadedBibles['zh-lzz']?.[viewState.bookId]?.[viewState.chapter]?.[i] || "", ncv: loadedBibles['zh-ncv']?.[viewState.bookId]?.[viewState.chapter]?.[i] || "" },
                    english: { niv: loadedBibles['en-niv']?.[viewState.bookId]?.[viewState.chapter]?.[i] || "", nasb: loadedBibles['en-nasb']?.[viewState.bookId]?.[viewState.chapter]?.[i] || "", kjv: loadedBibles['en-kjv']?.[viewState.bookId]?.[viewState.chapter]?.[i] || "" },
                    original: { 'orig-wlc': wlc || "", 'orig-lxx': loadedBibles['orig-lxx']?.[viewState.bookId]?.[viewState.chapter]?.[i] || "", 'orig-na28': na28 || "" },
                    isOT
                });
            }
            newVerses.forEach(v => {
                ['cuv', 'lzz', 'ncv'].forEach(k => { if(!v.chinese[k]) v.chinese[k] = `[尚未匯入]`; });
                ['niv', 'nasb', 'kjv'].forEach(k => { if(!v.english[k]) v.english[k] = `[尚未匯入]`; });
                ['orig-wlc', 'orig-lxx', 'orig-na28'].forEach(k => { if(!v.original[k]) v.original[k] = `[尚未匯入]`; });
            });
            setVerses(newVerses); setTimeout(() => setFetching(false), 200);
          }, [viewState, loadedBibles]);

          useEffect(() => {
            if (appReady && (activeTab === 'read' || activeTab === 'compare')) loadChapter();
          }, [appReady, activeTab, loadChapter]);

          const handleBibleSearch = (textQuery) => {
              setBibleSearchQuery(textQuery);
              const q = textQuery.trim();
              if (!q) { setBibleSearchResults([]); return; }
              const currentVersionData = loadedBibles[readVersion];
              if (!currentVersionData) { setBibleSearchResults([]); return; }
              const matchResults = []; let totalFound = 0; const allBooksOrdered = [...BIBLE_STRUCTURE.OT, ...BIBLE_STRUCTURE.NT];
              for (const book of allBooksOrdered) {
                  const bookMap = currentVersionData[book.id]; if (!bookMap) continue;
                  for (const chKey of Object.keys(bookMap)) {
                      const chData = bookMap[chKey];
                      for (const vKey of Object.keys(chData)) {
                          const verseText = String(chData[vKey]);
                          if (verseText && verseText.includes(q)) {
                              matchResults.push({ id: `${book.id}_${chKey}_${vKey}`, bookName: book.name, bookId: book.id, chapter: parseInt(chKey), verse: parseInt(vKey), text: verseText });
                              totalFound++; if (totalFound >= 80) break;
                          }
                      }
                      if (totalFound >= 80) break;
                  }
                  if (totalFound >= 80) break;
              }
              setBibleSearchResults(matchResults);
          };

          // --- ☁️ 雲端一鍵下載 ---
          const fetchCloudData = async () => {
            const fileOrFiles = CLOUD_FILES[importTarget];
            if (!fileOrFiles) {
                setToastMsg('❌ 找不到對應的雲端檔案名稱設定');
                return;
            }
            
            try {
                setImporting(true);
                let mergedData = {};
                
                if (Array.isArray(fileOrFiles)) {
                    setToastMsg(`⏳ 正在下載 ${importTarget.toUpperCase()} (共 ${fileOrFiles.length} 個分割檔)...`);
                    for (let i = 0; i < fileOrFiles.length; i++) {
                        const url = `${GITHUB_BASE_URL}/${fileOrFiles[i]}`;
                        setToastMsg(`⏳ 下載進度：${i + 1}/${fileOrFiles.length}...`);
                        const response = await fetch(url);
                        if (!response.ok) throw new Error(`檔案 ${fileOrFiles[i]} 請求失敗`);
                        const json = await response.json();
                        Object.assign(mergedData, normalizeBibleData(json));
                    }
                } else {
                    setToastMsg(`⏳ 正在從 GitHub 下載 ${importTarget.toUpperCase()}...`);
                    const url = `${GITHUB_BASE_URL}/${fileOrFiles}`;
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('網絡請求失敗');
                    const json = await response.json();
                    mergedData = normalizeBibleData(json);
                }

                if (Object.keys(mergedData).length > 0) {
                  await saveToDB(importTarget, mergedData);
                  setLoadedBibles(prev => ({ ...prev, [importTarget]: mergedData }));
                  setToastMsg(`✅ ${importTarget.toUpperCase()} 下載並儲存成功！`);
                } else {
                  setToastMsg(`❌ 解析失敗：無法識別結構 (請檢查檔案格式是否正確)`);
                }
            } catch (err) {
                console.error("下載錯誤:", err);
                setToastMsg(`❌ 下載失敗：請檢查 GitHub 檔案`);
            } finally {
                setImporting(false);
                setTimeout(() => setToastMsg(''), 3000);
            }
          };

          const handleFileUpload = (e) => {
            const file = e.target.files[0]; if (!file) return;
            setImporting(true); const reader = new FileReader();
            reader.onload = async (evt) => {
                try {
                    let json; try { json = JSON.parse(evt.target.result); } catch (je) { throw new Error(`JSON 語法故障 (${je.message})`); }
                    const normalized = normalizeBibleData(json);
                    if (Object.keys(normalized).length > 0) {
                      try { await saveToDB(importTarget, normalized); } catch (de) { throw new Error(`資料庫權限出錯 (${de.message || de})`); }
                      setLoadedBibles(prev => ({ ...prev, [importTarget]: normalized }));
                      setToastMsg(`✅ ${importTarget.toUpperCase()} 匯入成功`);
                    } else { setToastMsg('❌ 格式不支援或解析失敗'); }
                } catch (err) { setToastMsg(`❌ ${err.message}`); }
                setImporting(false); e.target.value = '';
            };
            reader.readAsText(file);
          };

          // 核心搜尋引擎
          const executeDictSearch = (query, currentDictId, contextMorph = null) => {
              const qRaw = query.trim().toLowerCase(); 
              if (!qRaw) return [];
              
              const normalizeFinalForms = (str) => str.replace(/ך/g, 'כ').replace(/ם/g, 'מ').replace(/ן/g, 'נ').replace(/ף/g, 'פ').replace(/ץ/g, 'צ');
              const qClean = normalizeFinalForms(removeDiacritics(qRaw));

              if (qClean === 'פ') return [{ strongs: '標記', lemma: 'פ (Petuhah)', gloss: '開放段落標記 (Open Paragraph)', strongs_definition: '馬所拉文本中的段落標記，表示一個新的大段落或主題。它不是一個單字，因此沒有編號。' }];
              if (qClean === 'ס') return [{ strongs: '標記', lemma: 'ס (Setumah)', gloss: '封閉段落標記 (Closed Paragraph)', strongs_definition: '馬所拉文本中的段落標記，表示段落內的較小停頓。它不是一個單字，因此沒有編號。' }];
              if (qClean === '׀' || qRaw === '׀') return [{ strongs: '標記', lemma: '׀ (Paseq)', gloss: '分隔符號 (Divider)', strongs_definition: '文本中的垂直分隔線，用於引導朗讀暫停或分開容易混淆的單字。' }];

              let results = []; 
              
              // 🆕 升級：從點擊上下文直接提取精確的 Strong's 編號與 Lemma 原型字
              let explicitStrongs = null;
              let explicitLemma = null;
              let explicitGloss = null;
              let explicitEnglish = null;

              if (contextMorph) {
                  if (contextMorph.strongs) {
                      explicitStrongs = Array.isArray(contextMorph.strongs) ? String(contextMorph.strongs[0]) : String(contextMorph.strongs);
                  }
                  if (contextMorph.lemma || (contextMorph.lexicon && contextMorph.lexicon.lemma)) {
                      explicitLemma = normalizeFinalForms(removeDiacritics(contextMorph.lemma || contextMorph.lexicon.lemma));
                  }
                  explicitGloss = contextMorph.gloss || (contextMorph.lexicon && contextMorph.lexicon.gloss);
                  explicitEnglish = contextMorph.english;
              }

              // ============================================
              // 🆕 強制保底字典機制 (Highest Priority: Score 2000)
              // 保證每一個點擊都有翻譯結果，直接把 JSON 裡的 gloss 和 english 轉換成字典結果！
              // ============================================
              if (contextMorph && (explicitLemma || qClean)) { // 放寬條件：只要有 contextMorph 就觸發
                  results.push({
                      lemma: contextMorph.lemma || (contextMorph.lexicon && contextMorph.lexicon.lemma) || query,
                      strongs: explicitStrongs || '內建',
                      gloss: explicitGloss || explicitEnglish || '無翻譯',
                      definition: explicitEnglish ? `<span class="text-indigo-500 mr-1">內建翻譯:</span> ${explicitEnglish}` : '',
                      score: 2000,
                      isSynthesized: true,
                      // 保留原始的形態學資料讓卡片可以渲染綠色的標籤
                      morphology: contextMorph.morphology,
                      morph_code: contextMorph.morph_code,
                      pos: contextMorph.pos
                  });
              }

              // 如果沒有外部字典，直接返回上面建立的保底結果
              if (!loadedBibles[currentDictId]) {
                  return results;
              }

              const dict = loadedBibles[currentDictId];
              const isHebrewDict = currentDictId.includes('wlc');

              const getStrongConsonants = (str) => str.replace(/[אהוי]/g, '');
              const qStrong = isHebrewDict ? getStrongConsonants(qClean) : '';

              const qVariants = new Set([qClean]);
              if (isHebrewDict) {
                  const prefixes = ['וכש', 'ומש', 'ולמ', 'וכה', 'ומה', 'ולה', 'ובש', 'וי', 'ות', 'וב', 'ול', 'וכ', 'ומ', 'וה', 'וש', 'כש', 'מש', 'למ', 'כה', 'מה', 'לה', 'בש', 'ו', 'ב', 'ל', 'כ', 'm', 'ה', 'ש'];
                  const suffixes = ['יהמ', 'יהנ', 'ינו', 'כמ', 'כנ', 'ימ', 'ות', 'נו', 'המ', 'הנ', 'תי', 'תמ', 'תנ', 'יו', 'ו', 'ה', 'י', 'כ', 'מ', 'נ', 'ת'];
                  
                  let bases = [qClean];
                  for (let p of prefixes) {
                      if (qClean.startsWith(p) && qClean.length > p.length) {
                          const stripped = qClean.substring(p.length);
                          qVariants.add(stripped);
                          bases.push(stripped);
                      }
                  }
                  for (let base of bases) {
                      for (let s of suffixes) {
                          if (base.endsWith(s) && base.length > s.length) {
                              qVariants.add(base.substring(0, base.length - s.length));
                          }
                      }
                  }
              }
              const variantsArr = Array.from(qVariants);
              
              for (const [key, data] of Object.entries(dict)) {
                  const strongs = String(data.strongs || key).toLowerCase();
                  const lemmaRaw = data.lemma ? data.lemma.toLowerCase() : '';
                  const lemmaClean = normalizeFinalForms(removeDiacritics(lemmaRaw));
                  
                  const strongDef = data.strongs_definition ? data.strongs_definition.toLowerCase() : '';
                  const htmlDef = data.definition ? data.definition.toLowerCase() : '';
                  const gloss = data.gloss ? data.gloss.toLowerCase() : '';
                  
                  let score = 0;

                  // 🆕 絕對優先級 (Score: 1000)：如果有準確的 Strong's 編號，直接無腦匹配數字部分
                  if (explicitStrongs) {
                      const eMatch = explicitStrongs.match(/\d+/);
                      const dMatch = strongs.match(/\d+/);
                      if (eMatch && dMatch && eMatch[0] === dMatch[0]) {
                          score = 1000;
                      }
                  }
                  
                  // 🆕 次高優先級 (Score: 900)：如果我們有準確的 Lemma，直接精確匹配
                  if (score === 0 && explicitLemma && lemmaClean === explicitLemma) {
                      score = 900;
                  }

                  // 原本的文字匹配邏輯 (做為手動輸入搜尋的退路)
                  if (score === 0) {
                      if (strongs === qRaw || lemmaRaw === qRaw || gloss === qRaw || lemmaClean === qClean) {
                          score = 100;
                      } 
                      else if (variantsArr.includes(lemmaClean)) {
                          score = 95;
                      }
                  }

                  if (score === 0) {
                      for (let variant of variantsArr) {
                          if (variant.length >= 2 && lemmaClean.length >= 2) {
                              if (lemmaClean.length >= 3 && variant.includes(lemmaClean)) {
                                  score = Math.max(score, 60);
                              } else if (variant.length >= 3 && lemmaClean.includes(variant)) {
                                  score = Math.max(score, 60);
                              } else {
                                  let commonLen = 0;
                                  while (commonLen < variant.length && commonLen < lemmaClean.length && variant[commonLen] === lemmaClean[commonLen]) {
                                      commonLen++;
                                  }
                                  if (commonLen >= 3) score = Math.max(score, 50);
                                  else if (commonLen === 2 && (variant.length <= 3 || lemmaClean.length <= 3)) score = Math.max(score, 40);
                              }
                          }
                      }
                  }

                  if (isHebrewDict && score === 0 && qStrong.length >= 1) {
                      const lemmaStrong = getStrongConsonants(lemmaClean);
                      if (lemmaStrong.length >= 1) {
                          if (qStrong === lemmaStrong && qStrong.length >= 2) {
                              score = Math.max(score, 85);
                          } else if (lemmaStrong.length >= 2 && qStrong.includes(lemmaStrong)) {
                              score = Math.max(score, 45); 
                          } else if (qStrong.length >= 2 && lemmaStrong.includes(qStrong)) {
                              score = Math.max(score, 35);
                          }
                      }
                  }

                  if (score === 0) {
                      if (strongDef.includes(qRaw) || htmlDef.includes(qRaw) || gloss.includes(qRaw)) {
                          score += 30;
                      }
                  }

                  if (score > 0) {
                      results.push({ ...data, strongs, score });
                  }
              }

              results.sort((a, b) => {
                  if (b.score !== a.score) return b.score - a.score;
                  const aLenDiff = Math.abs((a.lemma || '').length - qRaw.length);
                  const bLenDiff = Math.abs((b.lemma || '').length - qRaw.length);
                  return aLenDiff - bLenDiff;
              });

              const uniqueResults = [];
              const seenStrongs = new Set();
              for (const r of results) {
                  if (!seenStrongs.has(r.strongs)) {
                      seenStrongs.add(r.strongs);
                      uniqueResults.push(r);
                      if (uniqueResults.length >= 30) break;
                  }
              }
              return uniqueResults;
          };

          const handleWordClick = (word, versionConfig, verseData, wordIndex) => {
            // 擴充正則表達式，移除更多標點符號，包含希臘文分號 (·) 和問號 (;)
            const clean = word.replace(/[.,;·׃!?()[\]{}"'־…—\-]/g, '').trim();
            if (!clean || clean === '尚未匯入' || clean.includes('尚未')) return;

            let activeDict = 'dict-wlc-strongs';
            if (versionConfig === 'orig-lxx') activeDict = 'dict-lxx-strongs';
            if (versionConfig === 'orig-na28') activeDict = 'dict-na28-strongs';
            
            // 🆕 先提取該字的詳細形態學資料，等一下直接傳給搜尋引擎
            let targetMorphInfo = null;
            if (verseData && wordIndex !== undefined) {
                // 如果是新約，直接從原本的經文資料 (verseData.original['orig-na28']) 裡面抓，因為 NA28 的資料已經把所有東西包在一起了！
                if (!verseData.isOT && verseData.original['orig-na28']) {
                     const na28Words = verseData.original['orig-na28'];
                     if (Array.isArray(na28Words)) {
                         // 嘗試用 index 抓
                         targetMorphInfo = na28Words[wordIndex];
                         // 如果 index 抓出來的字不對，用文字去比對
                         if (targetMorphInfo && targetMorphInfo.word && targetMorphInfo.word.replace(/[.,;·׃!?()[\]{}"'־…—\-]/g, '').trim() !== clean) {
                             targetMorphInfo = na28Words.find(w => w.word && w.word.replace(/[.,;·׃!?()[\]{}"'־…—\-]/g, '').trim() === clean) || null;
                         }
                     }
                } 
                // 舊約邏輯保持不變
                else {
                    const targetMorphDB = loadedBibles['morph-wlc'];
                    if (targetMorphDB) {
                        const bData = targetMorphDB[verseData.bookId];
                        if (bData && bData[verseData.chapter] && bData[verseData.chapter][verseData.verseNum]) {
                            const vData = bData[verseData.chapter][verseData.verseNum];
                            targetMorphInfo = Array.isArray(vData) ? vData[wordIndex] : (vData[wordIndex] || vData[String(wordIndex)]);
                        }
                    }
                }
            }
            
            // 記錄點擊的上下文，供動態形態學資料庫查找
            if (verseData && wordIndex !== undefined) {
                setDictContext({
                    word: clean,
                    originalWord: word,
                    bookId: verseData.bookId,
                    chapter: verseData.chapter,
                    verseNum: verseData.verseNum,
                    wordIndex: wordIndex,
                    isOT: verseData.isOT // 記錄是新約還是舊約，以決定找哪個形態庫
                });
            } else {
                setDictContext(null);
            }

            setDictTarget(activeDict);
            setDictQuery(clean); 
            // 🆕 將 targetMorphInfo 傳給搜尋引擎，鎖定 100% 精確匹配！
            setDictResults(executeDictSearch(clean, activeDict, targetMorphInfo)); 
            setDictOpen(true);
          };

          const getVerseText = (verse, config) => {
            const [lang, ver] = config.split('-');
            if (lang === 'zh') return verse.chinese[ver]; if (lang === 'en') return verse.english[ver]; if (lang === 'orig') return verse.original[config];
            return "[未知]";
          };

          const renderOriginal = (v, config, fs, isParagraphMode = false) => {
              const text = v.original[config] || "";
              if (!text || text.startsWith('[')) return <span style={{ fontSize: `${fs}px` }} className="text-slate-400 font-medium">尚未匯入</span>;
              
              const isHebrew = config === 'orig-wlc'; 
              const dir = isHebrew ? 'rtl' : 'ltr';
              
              let words = [];
              if (Array.isArray(text)) {
                  words = text;
              } else {
                  words = text.split(/\s+/).filter(w => w).map(w => ({ text: w }));
              }
              
              const renderedWords = words.map((wordObj, i) => {
                  // 支援 NA28 的 word 屬性 或 WLC 的 text 屬性
                  const wStr = wordObj.word || wordObj.text || wordObj; 
                  return (
                      <span key={i} onClick={() => handleWordClick(wStr, config, v, i)} className="inline-flex flex-col items-center cursor-pointer hover:bg-amber-100 dark:hover:bg-amber-900/30 rounded px-0.5 py-1 transition-colors group">
                        <span style={{ fontSize: `${fs}px` }} className={`font-bold leading-none ${v.isOT ? 'text-indigo-900 dark:text-indigo-300' : 'text-emerald-900 dark:text-emerald-300'}`}>{wStr}</span>
                        <span className="text-[9px] text-amber-800 dark:text-amber-500 italic mt-0.5 leading-none" dir="ltr">{autoTransliterate(wStr, isHebrew)}</span>
                      </span>
                  );
              });
              if (isParagraphMode) return <span className="inline-flex flex-wrap gap-x-1.5 gap-y-1 align-bottom mx-1" dir={dir}>{renderedWords}</span>;
              return <div className={`flex flex-wrap gap-x-1 gap-y-2 content-start flex-1 ${dir === 'rtl' ? 'justify-start' : ''}`} dir={dir}>{renderedWords}</div>;
          };

          const getContextMorphology = () => {
              if (!dictContext) return null;
              
              try {
                  const { bookId, chapter, verseNum, wordIndex, isOT } = dictContext;
                  // 根據新舊約選擇正確的形態學資料庫
                  const targetMorphDB = isOT ? loadedBibles['morph-wlc'] : loadedBibles['morph-na28'];
                  
                  if (!targetMorphDB) return null;
                  
                  const bookData = targetMorphDB[bookId];
                  if (!bookData) return null;
                  
                  const chapterData = bookData[chapter];
                  if (!chapterData) return null;
                  
                  const verseData = chapterData[verseNum];
                  if (!verseData) return null;

                  let morphInfo = null;
                  if (Array.isArray(verseData)) {
                      morphInfo = verseData[wordIndex];
                  } else if (typeof verseData === 'object') {
                      morphInfo = verseData[wordIndex] || verseData[String(wordIndex)];
                  }
                  
                  return morphInfo;
              } catch (e) {
                  return null;
              }
          };

          if (!appReady) return (
            <div className="h-screen w-full flex flex-col items-center justify-center bg-slate-950 text-white">
              <div className="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
              <div className="font-black tracking-widest animate-pulse">MANUSCRIPT SYNC</div>
            </div>
          );

          return (
            <div className="h-[100dvh] flex flex-col overflow-hidden transition-colors duration-300 bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
              
              {/* Toast 訊息欄 */}
              {toastMsg && (
                <div className="fixed top-16 left-1/2 -translate-x-1/2 z-[200] bg-indigo-600 text-white px-4 py-2 rounded-full text-xs font-bold shadow-lg flex items-center gap-2 animate-in slide-in-from-bottom">
                    <Check className="w-4 h-4" /> {toastMsg} 
                </div>
              )}

              {/* 導航側欄 */}
              {isNavOpen && (
                <div className="fixed inset-0 z-[150] bg-slate-50 dark:bg-slate-950 flex flex-col animate-in slide-in-from-bottom">
                   <div className="p-4 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center bg-white dark:bg-slate-900 sticky top-0 shadow-sm transition-colors">
                      <button onClick={() => navStep === 'chapter' ? setNavStep('book') : setIsNavOpen(false)} className="w-10 h-10 flex items-center justify-center bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl active:scale-95 transition-colors">
                         {navStep === 'chapter' ? <ChevronLeft className="text-slate-700 dark:text-slate-300"/> : <X className="text-slate-700 dark:text-slate-300"/>}
                      </button>
                      <h2 className="font-black text-lg text-slate-800 dark:text-slate-100">{navStep === 'book' ? '選擇書卷' : viewState.book}</h2>
                      <div className="w-10"></div>

                                               <select value={slot} onChange={(e) => { const n = [...verticalSlots]; n[sIdx] = e.target.value; setVerticalSlots(n); }} className="text-[10px] font-black text-slate-400 uppercase tracking-widest bg-transparent border-none p-0 cursor-pointer outline-none">
                                                  <optgroup label="中文"><option value="zh-cuv">和合本</option><option value="zh-lzz">呂振中</option><option value="zh-ncv">新譯本</option></optgroup>
                                                  <optgroup label="英文"><option value="en-niv">NIV</option><option value="en-nasb">NASB</option><option value="en-kjv">KJV</option></optgroup>
                                                  <optgroup label="原文"><option value="orig-wlc">WLC 希伯來文</option><option value="orig-lxx">LXX 七十士</option><option value="orig-na28">NA28 新約</option></optgroup>
                                               </select>
                                            </div>
                                            <div className="flex-1 w-full">
                                               {slot.startsWith('orig') ? renderOriginal(verse, slot, fontSize, false) : (
                                                  <p style={{ fontSize: `${fontSize}px` }} className={`w-full ${slot.startsWith('en') ? 'italic font-serif text-slate-600 dark:text-slate-400' : 'font-bold text-slate-800 dark:text-slate-200'} leading-relaxed`}>{getVerseText(verse, slot)}</p>
                                               )}
                                            </div>
                                         </div>
                                      ))}
                                   </div>
                                ) : (
                                   <div className="grid grid-cols-3 gap-2 min-w-0 w-full overflow-hidden">
                                      <div className="border-r border-slate-100 dark:border-slate-800 pr-1.5 flex flex-col min-w-0">
                                         <div className="mb-2 shrink-0">
                                            <select value={horizVersions.zh} onChange={e => setHorizVersions({...horizVersions, zh: e.target.value})} className="text-[9px] font-black text-slate-500 bg-slate-100 dark:bg-slate-800 rounded py-0.5 px-1 outline-none cursor-pointer max-w-full truncate">
                                               <option value="cuv">和合本</option><option value="lzz">呂振中</option><option value="ncv">新譯本</option>
                                            </select>
                                         </div>
                                         <p style={{ fontSize: `${Math.max(11, fontSize - 3)}px` }} className="font-bold text-slate-800 dark:text-slate-200 leading-relaxed break-all">{verse.chinese[horizVersions.zh] || "尚未匯入"}</p>
                                      </div>
                                      
                                      <div className="border-r border-slate-100 dark:border-slate-800 pr-1.5 flex flex-col min-w-0">
                                         <div className="mb-2 shrink-0">
                                            <select value={horizVersions.en} onChange={e => setHorizVersions({...horizVersions, en: e.target.value})} className="text-[9px] font-black text-slate-500 bg-slate-100 dark:bg-slate-800 rounded py-0.5 px-1 outline-none cursor-pointer max-w-full truncate">
                                               <option value="niv">NIV</option><option value="nasb">NASB</option><option value="kjv">KJV</option>
                                            </select>
                                         </div>
                                         <p style={{ fontSize: `${Math.max(11, fontSize - 3)}px` }} className="italic font-serif text-slate-600 dark:text-slate-400 leading-relaxed break-all">{verse.english[horizVersions.en] || "尚未匯入"}</p>
                                      </div>
                                      
                                      <div className="flex flex-col min-w-0">
                                         <div className="mb-2 shrink-0">
                                            <select value={horizVersions.orig} onChange={e => setHorizVersions({...horizVersions, orig: e.target.value})} className="text-[9px] font-black text-amber-600 bg-amber-50 dark:bg-amber-900/20 rounded py-0.5 px-1 outline-none cursor-pointer max-w-full truncate">
                                               <option value="orig-wlc">WLC 希伯來</option><option value="orig-lxx">LXX 七十士</option><option value="orig-na28">NA28 新約</option>
                                            </select>
                                         </div>
                                         <div className="w-full min-w-0 break-all">{renderOriginal(verse, horizVersions.orig, Math.max(11, fontSize - 3), false)}</div>
                                      </div>
                                   </div>
                                )}
                             </div>
                          </div>
                          ))
                       )}
                    </div>
                 )}

                 {/* 搜尋分頁 */}
                 {activeTab === 'search' && (
                    <div className="px-4 py-6 flex flex-col h-full animate-in fade-in pb-40">
                        <div className="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm sticky top-0 z-10 flex gap-2 mb-4">
                            <input 
                                value={bibleSearchQuery}
                                onChange={e => handleBibleSearch(e.target.value)}
                                className="w-full bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 text-sm font-bold text-slate-800 dark:text-slate-200 outline-none focus:border-indigo-500"
                                placeholder={`在目前 [${readVersion.toUpperCase()}] 譯本中搜尋字眼...`}
                            />
                            <div className="w-12 h-12 shrink-0 bg-indigo-600 rounded-xl flex items-center justify-center text-white">
                                <Search className="w-5 h-5" />
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto no-scrollbar space-y-3">
                            {!loadedBibles[readVersion] ? (
                                <div className="h-full flex flex-col items-center justify-center text-slate-400 text-xs font-bold text-center py-20">
                                    當前選擇的譯本 [{readVersion.toUpperCase()}] 尚未有經文，<br/>請先到設定頁面匯入 JSON 檔。
                                </div>
                            ) : bibleSearchQuery.trim() === "" ? (
                                <div className="h-full flex flex-col items-center justify-center text-slate-400 text-xs font-bold text-center py-20">
                                    請輸入文字關鍵字開始全面檢索聖經。
                                </div>
                            ) : bibleSearchResults.length === 0 ? (
                                <div className="h-full flex flex-col items-center justify-center text-slate-400 text-xs font-bold text-center py-20">
                                    找不到包含「{bibleSearchQuery}」的經文節數。
                                </div>
                            ) : (
                                <>
                                    <div className="text-[11px] font-black text-slate-400 px-1 uppercase tracking-wider">找到 {bibleSearchResults.length === 80 ? '80+' : bibleSearchResults.length} 處相符經文：</div>
                                    {bibleSearchResults.map(res => (
                                        <div 
                                            key={res.id} 
                                            onClick={() => {
                                                setViewState({ book: res.bookName, bookId: res.bookId, chapter: res.chapter });
                                                setActiveTab('read');
                                            }}
                                            className="p-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm cursor-pointer hover:border-indigo-400 active:scale-[0.99] transition-all"
                                        >
                                            <div className="text-[10px] font-black text-indigo-600 dark:text-indigo-400 mb-1">{res.bookName} 第 {res.chapter} 章 {res.verse} 節</div>
                                            <div style={{ fontSize: `${fontSize}px` }} className="text-slate-800 dark:text-slate-200 leading-relaxed font-medium">{res.text}</div>
                                        </div>
                                    ))}
                                </>
                            )}
                        </div>
                    </div>
                 )}

                 {activeTab === 'settings' && (
                    <div className="px-6 py-10 flex flex-col h-full animate-in fade-in overflow-y-auto pb-40 no-scrollbar">
                       <h2 className="text-2xl font-black text-slate-800 dark:text-slate-100 tracking-widest uppercase mb-8">Settings</h2>
                       <div className="space-y-6">
                          {/* 深色模式 */}
                          <div className="bg-white dark:bg-slate-900 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 p-5 shadow-sm">
                             <div className="flex justify-between items-center">
                                <div className="flex items-center gap-4">
                                   <div className="w-12 h-12 bg-slate-50 dark:bg-slate-800 rounded-2xl flex items-center justify-center">
                                      {isDarkMode ? <Moon className="w-3.5 h-3.5 text-indigo-400" /> : <Sun className="w-3.5 h-3.5 text-amber-500" />}
                                   </div>
                                   <div>
                                      <h3 className="font-bold text-slate-800 dark:text-slate-100 text-sm">深色模式 (Dark Mode)</h3>
                                   </div>
                                </div>
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className={`w-14 h-8 rounded-full relative flex items-center px-1 ${isDarkMode ? 'bg-indigo-600' : 'bg-slate-200 dark:bg-slate-700'}`}>
                                   <div className={`w-6 h-6 bg-white rounded-full shadow transition-transform duration-300 ${isDarkMode ? 'translate-x-6' : 'translate-x-0'}`} />
                                </button>
                             </div>
                          </div>

                          {/* 本地資料庫管理 */}
                          <div className="bg-white dark:bg-slate-900 rounded-[1.5rem] border border-slate-200 dark:border-slate-800 p-5 shadow-sm">
                             <div className="flex items-center gap-3 mb-6">
                                <div className="w-10 h-10 bg-indigo-50 dark:bg-indigo-900/30 rounded-xl flex items-center justify-center"><Database className="w-5 h-5 text-indigo-600"/></div>
                                <div>
                                   <h3 className="font-bold text-slate-800 dark:text-slate-100 text-sm">本地資料庫 (Local Database)</h3>
                                   <p className="text-xs text-slate-500 mt-0.5">管理手機內部離線聖經儲存</p>
                                </div>
                             </div>
                             
                             <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-6">
                                {[
                                  { id: 'zh-cuv', label: '和合本 (CUV)' }, { id: 'zh-lzz', label: '呂振中 (LZZ)' }, { id: 'zh-ncv', label: '新譯本 (NCV)' },
                                  { id: 'en-niv', label: 'NIV' }, { id: 'en-nasb', label: 'NASB' }, { id: 'en-kjv', label: 'KJV' },
                                  { id: 'orig-wlc', label: 'WLC 原文 (希伯來文)' }, { id: 'orig-lxx', label: 'LXX 譯本 (希臘文)' }, { id: 'orig-na28', label: 'NA28 新約 (希臘文)' },
                                  { id: 'dict-wlc-strongs', label: 'WLC 希伯來字典' },
                                  { id: 'dict-lxx-strongs', label: 'LXX 七十士字典' },
                                  { id: 'dict-na28-strongs', label: 'NA28 新約字典' },
                                  { id: 'morph-wlc', label: 'WLC 形態學數據庫 (13檔)' },
                                  { id: 'morph-na28', label: 'NA28 形態學數據庫 (3檔)' }
                                ].map(ver => (
                                   <div key={ver.id} className="flex justify-between items-center text-xs p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800 transition-colors">
                                      <span className="font-bold text-slate-700 dark:text-slate-300 text-[11px]">{ver.label}</span>
                                      
                                      {loadedBibles[ver.id] ? (
                                          <div className="flex items-center gap-2 shrink-0">
                                              <span className="text-emerald-500 font-black flex items-center gap-0.5"><Check className="w-3 h-3"/> 已載入</span>
                                              <button 
                                                  onClick={() => handleDeleteVersion(ver.id, ver.label)}
                                                  className="w-5 h-5 flex items-center justify-center rounded-md bg-red-50 dark:bg-red-950/40 text-red-500 hover:bg-red-500 hover:text-white active:scale-90 transition-all shadow-sm"
                                                  title="單獨刪除此項目"
                                              >
                                                  <X className="w-3 h-3" />
                                              </button>
                                          </div>
                                      ) : (
                                          <span className="text-slate-400 shrink-0">尚未匯入</span>
                                      )}
                                   </div>
                                ))}
                             </div>

                             {/* ☁️ 雲端一鍵下載區塊 */}
                             <div className="flex flex-col gap-3 p-4 bg-indigo-50/50 dark:bg-indigo-900/10 border border-indigo-100 dark:border-indigo-800/50 rounded-xl">
                                <select value={importTarget} onChange={e => setImportTarget(e.target.value)} className="p-3 rounded-lg text-sm font-bold bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none text-indigo-700 dark:text-indigo-300">
                                   <option value="zh-cuv">匯入為：和合本 (CUV)</option>
                                   <option value="zh-lzz">匯入為：呂振中 (LZZ)</option>
                                   <option value="zh-ncv">匯入為：新譯本 (CNV/NCV)</option>
                                   <option value="en-niv">匯入為：NIV</option>
                                   <option value="en-nasb">匯入為：NASB</option>
                                   <option value="en-kjv">匯入為：KJV</option>
                                   <option value="orig-wlc">匯入為：WLC 原文 (希伯來文)</option>
                                   <option value="orig-lxx">匯入為：LXX 七十士譯本 (希臘文)</option>
                                   <option value="orig-na28">匯入為：NA28 新約原文 (希臘文)</option>
                                   <option value="dict-wlc-strongs">匯入為：WLC 希伯來字典 (wlc_hebrew_dictionary.json)</option>
                                   <option value="dict-lxx-strongs">匯入為：LXX 七十士字典 (lxx_dictionary.json)</option>
                                   <option value="dict-na28-strongs">匯入為：NA28 新約字典 (na28_dictionary.json)</option>
                                   <option value="morph-wlc">匯入為：WLC 形態學與文法資料庫 (共 13 個分割檔)</option>
                                   <option value="morph-na28">匯入為：NA28 新約形態學與文法資料庫 (共 3 個分割檔)</option>
                                </select>
                                
                                <div className="flex gap-2">
                                   <button 
                                     onClick={fetchCloudData}
                                     disabled={importing}
                                     className="flex-1 flex justify-center items-center gap-2 bg-indigo-600 text-white py-3 rounded-xl font-black text-sm hover:bg-indigo-700 transition-colors disabled:opacity-50 active:scale-95"
                                   >
                                     {importing ? <Loader className="w-4 h-4 animate-spin" /> : <CloudDownload className="w-4 h-4" />}
                                     {importing ? '下載中...' : '從 GitHub 雲端下載'}
                                   </button>
                                   
                                   {/* 手動上傳作為後備 */}
                                   <div className="relative flex-1">
                                      <input type="file" accept=".json" onChange={handleFileUpload} disabled={importing} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer disabled:cursor-not-allowed" />
                                      <div className={`w-full h-full flex items-center justify-center gap-2 py-3 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 rounded-xl font-black text-sm transition-colors ${importing ? 'opacity-50' : 'hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer active:scale-95'}`}>
                                         <Upload className="w-4 h-4" /> 本地上傳
                                      </div>
                                   </div>
                                </div>
                             </div>

                             <button onClick={async () => { if(window.confirm('警告：這將會清除您手機中的「所有」聖經與字典數據！確定要繼續嗎？')) { await clearDB(); setLoadedBibles({}); setToastMsg('整個資料庫已重置清空'); } }} className="mt-6 w-full py-3 text-xs font-bold text-red-500 hover:text-red-600 bg-red-50 dark:bg-red-900/20 rounded-xl transition-colors">
                                清除所有已匯入資料 (重置資料庫)
                             </button>
                          </div>
                       </div>
                    </div>
                 )}
              </main>

              {/* 🛸 完美升級：全分頁通用「懸浮觸控滑動艙」（跨分頁自適應拖拽面板） */}
              {floatPos.x !== -100 && (
                  <div 
                      style={{ left: `${floatPos.x}px`, top: `${floatPos.y}px` }}
                      onPointerDown={handlePointerDown}
                      onPointerMove={handlePointerMove}
                      onPointerUp={handlePointerUp}
                      className={`fixed z-[140] w-12 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border border-slate-200/80 dark:border-slate-800 rounded-3xl shadow-2xl flex flex-col items-center py-2 select-none touch-none transition-shadow ${isDragging ? 'shadow-indigo-500/20 ring-2 ring-indigo-500/30 cursor-grabbing' : 'cursor-grab'}`}
                  >
                      {/* 上翻頁按鈕 */}
                      <button 
                          onPointerDown={(e) => e.stopPropagation()} 
                          onClick={() => mainRef.current?.scrollBy({ top: -window.innerHeight * 0.4, behavior: 'smooth' })}
                          className="w-9 h-9 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-full flex items-center justify-center hover:bg-indigo-600 hover:text-white dark:hover:bg-indigo-600 transition-all active:scale-90"
                      >
                          <ChevronDown className="w-5 h-5 rotate-180" />
                      </button>

                      {/* 艙體中央拖拽安全防滑刻紋 */}
                      <div className="flex flex-col gap-0.5 my-2.5 justify-center items-center opacity-40 pointer-events-none">
                          <div className="w-4 h-[2px] bg-slate-400 dark:bg-slate-500 rounded-full"></div>
                          <div className="w-4 h-[2px] bg-slate-400 dark:bg-slate-500 rounded-full"></div>
                          <div className="w-4 h-[2px] bg-slate-400 dark:bg-slate-500 rounded-full"></div>
                      </div>

                      {/* 下翻頁按鈕 */}
                      <button 
                          onPointerDown={(e) => e.stopPropagation()} 
                          onClick={() => mainRef.current?.scrollBy({ top: window.innerHeight * 0.4, behavior: 'smooth' })}
                          className="w-9 h-9 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-full flex items-center justify-center hover:bg-indigo-600 hover:text-white dark:hover:bg-indigo-600 transition-all active:scale-90"
                      >
                          <ChevronDown className="w-5 h-5" />
                      </button>
                  </div>
              )}

              {/* 浮動快捷導航列 (僅在讀經與對照分頁顯示) */}
              {(activeTab === 'read' || activeTab === 'compare') && !fetching && (
                <div className="fixed bottom-[105px] left-0 right-0 px-4 max-w-lg mx-auto z-40">
                   <div className="bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border border-slate-200/80 dark:border-slate-800 p-1.5 rounded-2xl shadow-lg flex gap-1.5">
                      <button onClick={handlePrevChapter} className="flex-[1.2] py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-100 dark:border-slate-700 rounded-xl text-slate-600 dark:text-slate-300 font-black text-xs flex items-center justify-center gap-1 active:scale-95 transition-transform">
                         <ChevronLeft className="w-4 h-4" /> 上一章
                      </button>
                      <div className="flex-[0.8] relative flex">
                         <select value={viewState.chapter} onChange={(e) => setViewState(v => ({ ...v, chapter: parseInt(e.target.value) }))} className="w-full appearance-none bg-indigo-50 dark:bg-indigo-900/30 border border-indigo-100 dark:border-indigo-800/50 rounded-xl text-indigo-500 dark:text-indigo-400 font-black text-[11px] text-center outline-none cursor-pointer py-2.5" style={{ textAlignLast: 'center' }}>
                            {Array.from({ length: [...BIBLE_STRUCTURE.OT, ...BIBLE_STRUCTURE.NT].find(b => b.id === viewState.bookId).chapters }, (_, i) => i + 1).map(ch => (
                               <option key={ch} value={ch}>CH {ch}</option>
                            ))}
                         </select>
                         <ChevronDown className="w-3 h-3 text-indigo-400 absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none" />
                      </div>
                      <button onClick={handleNextChapter} className="flex-[1.2] py-2.5 bg-indigo-600 rounded-xl text-white font-black text-xs flex items-center justify-center gap-1 shadow-md active:scale-95 transition-transform">
                         下一章 <ChevronDown className="w-4 h-4 -rotate-90" />
                      </button>
                   </div>
                </div>
              )}

              {/* 底部五向主導航列 */}
              <nav className="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 px-2 pt-2.5 pb-9 grid grid-cols-5 sticky bottom-0 z-50 shadow-[0_-10px_20px_rgba(0,0,0,0.03)] shrink-0">
                 <TabButton active={activeTab === 'home'} onClick={() => setActiveTab('home')} icon={<Home className="w-5 h-5" />} label="主頁" />
                 <TabButton active={activeTab === 'read'} onClick={() => setActiveTab('read')} icon={<Book className="w-5 h-5" />} label="讀經" />
                 <TabButton active={activeTab === 'compare'} onClick={() => setActiveTab('compare')} icon={<Layers className="w-5 h-5" />} label="對照" />
                 <TabButton active={activeTab === 'search'} onClick={() => setActiveTab('search')} icon={<Search className="w-5 h-5" />} label="搜尋" />
                 <TabButton active={activeTab === 'settings'} onClick={() => setActiveTab('settings')} icon={<LucideIcon name="settings" className="w-5 h-5" />} label="設定" />
              </nav>
            </div>
          );
        };

        const TabButton = ({ active, icon, label, onClick }) => (
          <button onClick={onClick} className={`flex flex-col items-center gap-1 transition-all ${active ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-400'}`}>
            <div className={`p-1.5 rounded-xl ${active ? 'bg-indigo-50 dark:bg-indigo-900/30' : ''}`}>{icon}</div>
            <span className="text-[9px] font-black tracking-tight">{label}</span>
          </button>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
