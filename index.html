                { id: "1CO", name: "哥林多前書", abbr: "林前", en: "1 Corinthians", chapters: 16 },
                { id: "2CO", name: "哥林多後書", abbr: "林後", en: "2 Corinthians", chapters: 13 },
                { id: "GAL", name: "加拉太書", abbr: "加", en: "Galatians", chapters: 6 },

                { id: "PHP", name: "腓立比書", abbr: "腓", en: "Philippians", chapters: 4 },
                { id: "COL", name: "歌羅西書", abbr: "西", en: "Colossians", chapters: 4 },
                { id: "1TH", name: "帖撒羅尼迦前書", abbr: "帖前", en: "1 Thessalonians", chapters: 5 },
                { id: "2TH", name: "帖撒羅尼迦後書", abbr: "帖後", en: "2 Thessalonians", chapters: 3 },
                { id: "1TI", name: "提摩太前書", abbr: "提前", en: "1 Timothy", chapters: 6 },
                { id: "2TI", name: "提摩太後書", abbr: "提後", en: "2 Timothy", chapters: 4 },
                { id: "TIT", name: "提多書", abbr: "多", en: "Titus", chapters: 3 },
                { id: "PHM", name: "腓利門書", abbr: "門", en: "Philemon", chapters: 1 },
                { id: "HEB", name: "希伯來書", abbr: "來", en: "Hebrews", chapters: 13 },
                { id: "JAS", name: "雅各書", abbr: "雅", en: "James", chapters: 5 },
                { id: "1PE", name: "彼得前書", abbr: "彼前", en: "1 Peter", chapters: 5 },
                { id: "2PE", name: "彼得後書", abbr: "彼後", en: "2 Peter", chapters: 3 },
                { id: "1JN", name: "約翰一書", abbr: "約一", en: "1 John", chapters: 5 },
                { id: "2JN", name: "約翰二書", abbr: "約二", en: "2 John", chapters: 1 },
                { id: "3JN", name: "約翰三書", abbr: "約三", en: "3 John", chapters: 1 },
                { id: "JUD", name: "猶大書", abbr: "猶", en: "Jude", chapters: 1 },
                { id: "REV", name: "啟示錄", abbr: "啟", en: "Revelation", chapters: 22 }
            ]
        };

        const THEMES = {
            zinc: { primary: 'slate-900', secondary: 'slate-100', accent: 'blue-600', ring: 'slate-200' },
            sepia: { primary: 'amber-900', secondary: 'amber-50', accent: 'amber-700', ring: 'amber-200' },
            sky: { primary: 'sky-900', secondary: 'sky-50', accent: 'sky-600', ring: 'sky-200' }
        };

        const App = () => {
            const [currentVerse, setCurrentVerse] = useState({ bookId: 'GEN', chapter: 1 });
            const [version1, setVersion1] = useState('cunp');
            const [version2, setVersion2] = useState('orig-wlc');
            const [version3, setVersion3] = useState('none');
            const [layoutMode, setLayoutMode] = useState('column'); // 'column' or 'row'
            const [darkMode, setDarkMode] = useState(false);
            const [activeTheme, setActiveTheme] = useState('zinc');
            
            const [loadedBibles, setLoadedBibles] = useState({});
            const [loadingState, setLoadingState] = useState({ total: 0, loaded: 0, text: '' });
            const [appReady, setAppReady] = useState(false);

            const [dictQuery, setDictQuery] = useState('');
            const [dictTarget, setDictTarget] = useState('dict-wlc-strongs');
            const [dictContext, setDictContext] = useState(null); // { word, bookId, chapter, verseNum, versionConfig }

            const contentRef = useRef(null);

            // --- 🤖 智慧連動：新舊約判斷與版本自動切換 ---
            const isOldTestament = (bookId) => {
                return BIBLE_STRUCTURE.OT.some(b => b.id === bookId);
            };

            useEffect(() => {
                const checkAndAutoSwitchVersion = () => {
                    const isOT = isOldTestament(currentVerse.bookId);
                    
                    // 檢查版本 2
                    if (isOT && version2 === 'orig-na28') {
                        setVersion2('orig-wlc');
                    } else if (!isOT && (version2 === 'orig-wlc' || version2 === 'orig-lxx')) {
                        setVersion2('orig-na28');
                    }

                    // 檢查版本 3
                    if (version3 !== 'none') {
                        if (isOT && version3 === 'orig-na28') {
                            setVersion3('orig-wlc');
                        } else if (!isOT && (version3 === 'orig-wlc' || version3 === 'orig-lxx')) {
                            setVersion3('orig-na28');
                        }
                        
                        // 防呆：如果自動切換後 version2 跟 version3 撞名，隱藏 version3
                        if (version2 === version3) {
                            setVersion3('none');
                        }
                    }
                };
                
                checkAndAutoSwitchVersion();
            }, [currentVerse.bookId, version2, version3]);

            // --- 🧠 智慧文法與詞性解析引擎 (Morphology Parser) ---
            const parseMorphologyTags = (rawCodeOrObj) => {
                if (!rawCodeOrObj) return [];
                
                let tags = [];
                const addTag = (tag) => { if (tag && !tags.includes(tag)) tags.push(tag); };

                // NA28 新格式處理 (如 "Function=Verb; Tense=Present; Voice=Active")
                if (rawCodeOrObj && rawCodeOrObj.morphology && typeof rawCodeOrObj.morphology === 'string' && rawCodeOrObj.morphology.includes('=')) {
                    rawCodeOrObj.morphology.split(';').forEach(part => {
                        const cleanPart = part.trim();
                        if (cleanPart) {
                            const [key, val] = cleanPart.split('=');
                            if (key && val) {
                                const transMap = {
                                    'Function': '功能', 'Verb': '動詞', 'Noun': '名詞', 'Adjective': '形容詞', 'Conjunction': '連接詞', 'Article': '冠詞', 'Preposition': '介系詞', 'Interjection': '感嘆詞', 'Particle': '助詞', 'Pronoun': '代名詞', 'Relative pronoun': '關係代名詞', 'Definite article': '定冠詞', 'Personal pronoun': '人稱代名詞', 'Demonstrative pronoun': '指示代名詞', 'Reflexive pronoun': '反身代名詞', 'Interrogative pronoun': '疑問代名詞', 'Possessive pronoun': '所有格代名詞', 'Particle or Disjunctive': '助詞或反義詞',
                                    'Tense': '時態', 'Present': '現在式', 'Aorist': '不定過去式', 'Imperfect': '未完成式', 'Perfect': '完成式', 'Future': '未來式', 'Pluperfect': '過去完成式', '2nd Aorist': '第二不定過去式', '2nd Future': '第二未來式',
                                    'Voice': '語態', 'Active': '主動', 'Passive': '被動', 'Middle': '關身', 'Middle Deponent': '關身異態', 'Passive Deponent': '被動異態', 'Middle or Passive Deponent': '關/被異態', 'Middle or Passive': '關身或被動',
                                    'Mood': '語氣', 'Indicative': '直陳', 'Subjunctive': '假設', 'Imperative': '祈使', 
                                    'Form': '形式', 'Participle': '分詞', 'Infinitive': '不定詞',
                                    'Person': '人稱', '1st': '第一', '2nd': '第二', '3rd': '第三',
                                    'Number': '單複', 'Singular': '單數', 'Plural': '複數',
                                    'Case': '格位', 'Nominative': '主格', 'Genitive': '屬格', 'Dative': '與格', 'Accusative': '賓格', 'Vocative': '呼格',
                                    'Gender': '性別', 'Masculine': '陽性', 'Feminine': '陰性', 'Neuter': '中性',
                                    'Extra': '補充', 'Negative': '否定', 'Interrogative': '疑問', 'Contracted form': '縮寫形式',
                                    'Name type': '專名類型', 'Person Gentilic': '人名/族名', 'Location Gentilic': '地名/族名', 'Location': '地名', 'Individual': '人名', 'Title': '頭銜',
                                    'Adj.Numb.': '數字屬性', 'Indeclinable Numeral': '不變形數字',
                                    'Original language': '原始語言', 'Transcribed from Hebrew': '譯自希伯來文'
                                };
                                const transKey = transMap[key.trim()] || key.trim();
                                const transVal = transMap[val.trim()] || val.trim();
                                addTag(`${transKey}: ${transVal}`);
                            } else {
                                addTag(cleanPart);
                            }
                        }
                    });
                    
                    if (rawCodeOrObj.pos && !rawCodeOrObj.morphology.includes('Function=')) addTag(`詞性: ${rawCodeOrObj.pos}`);
                    if (rawCodeOrObj.morph_code) addTag(`代碼: ${rawCodeOrObj.morph_code}`);
                    
                    if (tags.length > 0) return tags;
                }

                // 自訂 morph_analysis 結構處理
                if (rawCodeOrObj && typeof rawCodeOrObj === 'object' && rawCodeOrObj.morph_analysis && rawCodeOrObj.morph_analysis.parts) {
                    rawCodeOrObj.morph_analysis.parts.forEach(part => {
                        const posMap = {
                            'noun': '名詞', 'verb': '動詞', 'adjective': '形容詞', 'adverb': '副詞', 
                            'pronoun': '代名詞', 'preposition': '介系詞', 'conjunction': '連接詞', 
                            'interjection': '感嘆詞', 'particle': '助詞', 'article': '冠詞'
                        };
                        if (part.pos && posMap[part.pos.toLowerCase()]) addTag(`詞性: ${posMap[part.pos.toLowerCase()]}`);
                        else if (part.pos) addTag(`詞性: ${part.pos}`);

                        const genderMap = { 'masculine': '陽性', 'feminine': '陰性', 'common': '通性' };
                        if (part.gender && genderMap[part.gender.toLowerCase()]) addTag(genderMap[part.gender.toLowerCase()]);
                        else if (part.gender) addTag(part.gender);

                        const numMap = { 'singular': '單數', 'plural': '複數', 'dual': '雙數' };
                        if (part.number && numMap[part.number.toLowerCase()]) addTag(numMap[part.number.toLowerCase()]);
                        else if (part.number) addTag(part.number);

                        const stateMap = { 'absolute': '絕對態', 'construct': '附屬態' };
                        if (part.state && stateMap[part.state.toLowerCase()]) addTag(stateMap[part.state.toLowerCase()]);

                        const stemMap = {
                            'qal': 'Qal(輕)', 'niphal': 'Niphal(被動)', 'piel': 'Piel(強調)', 
                            'pual': 'Pual(強被)', 'hiphil': 'Hiphil(使役)', 'hophal': 'Hophal(使被)', 'hithpael': 'Hithpael(反身)'
                        };
                        if (part.stem && stemMap[part.stem.toLowerCase()]) addTag(`語幹: ${stemMap[part.stem.toLowerCase()]}`);

                        const conjMap = {
                            'perfect': '完成式', 'imperfect': '未完成式', 'sequential imperfect': '連續未完成式',
                            'imperative': '祈使語氣', 'infinitive construct': '附屬不定詞', 'infinitive absolute': '絕對不定詞',
                            'participle': '分詞'
                        };
                        if (part.conjugation && conjMap[part.conjugation.toLowerCase()]) addTag(`語氣: ${conjMap[part.conjugation.toLowerCase()]}`);
                        else if (part.conjugation) addTag(`語氣: ${part.conjugation}`);

                        const personMap = { '1st': '第一人稱', '2nd': '第二人稱', '3rd': '第三人稱' };
                        if (part.person && personMap[part.person.toLowerCase()]) addTag(personMap[part.person.toLowerCase()]);
                    });
                    
                    if (tags.length > 0) return tags;
                }

                // 備用字串解析邏輯 (Fallback)
                let rawCode = '';
                let posRaw = '';
                
                if (typeof rawCodeOrObj === 'object') {
                   rawCode = String(rawCodeOrObj.morph_code || rawCodeOrObj.morphology_code || rawCodeOrObj.morphology || rawCodeOrObj.morphology_full || (rawCodeOrObj.morphology_detail && rawCodeOrObj.morphology_detail.code) || rawCodeOrObj.morph || '').trim();
                   posRaw = String(rawCodeOrObj.part_of_speech || rawCodeOrObj.pos || (rawCodeOrObj.morphology_detail && rawCodeOrObj.morphology_detail.pos) || '').trim();
                } else {
                   rawCode = String(rawCodeOrObj).trim();
                }

                // 過濾 N/A
                if (rawCode.toUpperCase() === 'N/A' || rawCode.toUpperCase() === 'NONE') rawCode = '';
                if (posRaw.toUpperCase() === 'N/A' || posRaw.toUpperCase() === 'NONE') posRaw = '';

                const fullTermMap = {
                    'noun': '名詞', 'verb': '動詞', 'adj': '形容詞', 'adjective': '形容詞', 'adv': '副詞', 'adverb': '副詞',
                    'prep': '介系詞', 'conj': '連接詞', 'pron': '代名詞', 'art': '冠詞', 'part': '助詞', 'intj': '感嘆詞',
                    'masc': '陽性', 'masculine': '陽性', 'fem': '陰性', 'feminine': '陰性', 'neut': '中性', 'common': '通性',
                    'sing': '單數', 'singular': '單數', 'plur': '複數', 'plural': '複數', 'dual': '雙數',
                    'nom': '主格', 'gen': '屬格', 'dat': '與格', 'acc': '賓格', 'voc': '呼格',
                    'pres': '現在式', 'aor': '不定過去', 'imperf': '未完成', 'perf': '完成', 'fut': '未來',
                    'ind': '直陳', 'subj': '假設', 'impv': '祈使', 'inf': '不定詞', 'ptcp': '分詞',
                    'act': '主動', 'mid': '關身', 'pass': '被動', '1st': '第一人稱', '2nd': '第二人稱', '3rd': '第三人稱',
                    'qal': 'Qal', 'niphal': 'Niphal', 'piel': 'Piel', 'pual': 'Pual', 'hiphil': 'Hiphil', 'hophal': 'Hophal', 'hithpael': 'Hithpael',
                    'absolute': '絕對態', 'construct': '附屬態'
                };

                Object.entries(fullTermMap).forEach(([en, zh]) => {
                    if (new RegExp(`\\b${en}\\b`).test(rawCode.toUpperCase()) || new RegExp(`\\b${en}\\b`).test(posRaw.toUpperCase())) {
                        addTag(zh);
                    }
                });

                if (tags.length === 0) {
                    if (posRaw) tags.push(posRaw.includes('詞') || posRaw.includes('(') ? posRaw : `詞性: ${posRaw}`);
                    if (rawCode && rawCode !== posRaw) tags.push(`文法: ${rawCode}`);
                    if (typeof rawCodeOrObj === 'string' && rawCodeOrObj && rawCode.toUpperCase() !== 'N/A') tags.push(rawCodeOrObj);
                }

                return tags;
            };

            // --- JSON 解析正規化 ---
            const normalizeBibleData = (rawJson) => {
                const result = {}; 
                
                if (rawJson && typeof rawJson === 'object' && !Array.isArray(rawJson)) {
                    const keys = Object.keys(rawJson);
                    if (keys.length > 0 && /^[GH]\d+/.test(keys[0])) return rawJson; // 是字典檔
                }

                const allBooks = [...BIBLE_STRUCTURE.OT, ...BIBLE_STRUCTURE.NT];
                const bookMap = {};
                allBooks.forEach(b => {
                    bookMap[b.name] = b.id; bookMap[b.en] = b.id; bookMap[b.abbr] = b.id;
                    bookMap[b.en.toUpperCase()] = b.id; bookMap[b.abbr.toUpperCase()] = b.id;
                });

                const ALIASES = {
                  '1CHR': '1CH', '2CHR': '2CH', '1SAM': '1SA', '2SAM': '2SA', '1KGS': '1KI', '2KGS': '2KI', 
                  'PSALM': 'PSA', 'SONG': 'SNG', 'CANTICLES': 'SNG', 'EZEK': 'EZK', 'MATT': 'MAT', 'MARK': 'MRK',
                  'LUKE': 'LUK', 'JOHN': 'JHN', '1COR': '1CO', '2COR': '2CO', '1THESS': '1TH', '2THESS': '2TH', 
                  '1TIM': '1TI', '2TIM': '2TI', 'PHILEM': 'PHM', 'HEB': 'HEB', 'JAMES': 'JAS', '1PET': '1PE',
                  '2PET': '2PE', '1JOHN': '1JO', '2JOHN': '2JO', '3JOHN': '3JO', 'REV': 'REV'
                };
                
                const parseVerseRef = (refStr) => {
                    if (!refStr) return null;
                    const parts = refStr.split('.');
                    if (parts.length >= 3) {
                        return { bookAbbr: parts[0], chapter: parseInt(parts[1]), verse: parseInt(parts[2]) };
                    }
                    return null;
                };

                const getBookId = (name) => {
                    if (!name) return null;
                    let n = String(name).trim();
                    let upper = n.toUpperCase();
                    if (ALIASES[upper]) return ALIASES[upper];
                    if (bookMap[n]) return bookMap[n];
                    if (bookMap[upper]) return bookMap[upper];
                    const found = allBooks.find(b => b.name === n || b.en.toUpperCase() === upper || b.abbr.toUpperCase() === upper);
                    return found ? found.id : null;
                };

                const ensurePath = (bId, ch) => {
                  if(!result[bId]) result[bId] = {};
                  if(!result[bId][ch]) result[bId][ch] = {};
                };

                try {
                    // NA28 新格式: { "Act.1.1": [ { "word": "...", ... } ] }
                    if (typeof rawJson === 'object' && !Array.isArray(rawJson)) {
                        const firstKey = Object.keys(rawJson)[0];
                        if (firstKey && firstKey.includes('.') && Array.isArray(rawJson[firstKey])) {
                            for (const verseRef in rawJson) {
                                const ref = parseVerseRef(verseRef);
                                if (ref) {
                                    const bId = getBookId(ref.bookAbbr);
                                    if (bId) {
                                        ensurePath(bId, ref.chapter);
                                        result[bId][ref.chapter][ref.verse] = rawJson[verseRef];
                                    }
                                }
                            }
                            return result;
                        }
                    }

                    // 舊格式: { "1Chr": [ { "verse": "1Chr.1.1", "words": [...] } ] }
                    if (typeof rawJson === 'object' && !Array.isArray(rawJson)) {
                        const firstKey = Object.keys(rawJson)[0];
                        if (firstKey && Array.isArray(rawJson[firstKey]) && rawJson[firstKey][0] && rawJson[firstKey][0].verse && rawJson[firstKey][0].words) {
                            for (const bookKey in rawJson) {
                                const bId = getBookId(bookKey);
                                if (bId) {
                                    rawJson[bookKey].forEach(verseObj => {
                                        const ref = parseVerseRef(verseObj.verse);
                                        if (ref) {
                                            ensurePath(bId, ref.chapter);
                                            result[bId][ref.chapter][ref.verse] = verseObj.words;
                                        }
                                    });
                                }
                            }
                            return result;
                        }
                    }

                    // 格式 A: 陣列 [{book_name, chapter, verse, text}] (如 LXX)
                    if (Array.isArray(rawJson) && rawJson.length > 0 && rawJson[0].book_name) {
                        rawJson.forEach(item => {
                            const bId = getBookId(item.book_name);
                            if (bId) {
                                ensurePath(bId, item.chapter);
                                result[bId][item.chapter][item.verse] = item.text || item.words || item.content;
                            }
                        });
                        return result;
                    }

                    // 格式 B: 嵌套物件 { bookName: { chapterNum: { verseNum: text } } }
                    for (const bookKey in rawJson) {
                        const bId = getBookId(bookKey);
                        if (bId) {
                            result[bId] = {};
                            for (const chKey in rawJson[bookKey]) {
                                result[bId][chKey] = {};
                                for (const vKey in rawJson[bookKey][chKey]) {
                                    result[bId][chKey][vKey] = rawJson[bookKey][chKey][vKey];
                                }
                            }
                        }
                    }
                    return result;

                } catch (e) {
                    console.error("解析 JSON 發生錯誤:", e);
                    return {};
                }
            };

            useEffect(() => {
                const loadData = async () => {
                    const keys = Object.keys(FILE_ENDPOINTS);
                    setLoadingState({ total: keys.length, loaded: 0, text: '啟動中...' });
                    
                    const data = {};
                    let loadedCount = 0;

                    for (const key of keys) {
                        try {
                            setLoadingState(p => ({ ...p, text: `載入 ${key}...` }));
                            const res = await fetch(FILE_ENDPOINTS[key]);
                            if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                            const raw = await res.json();
                            
                            if (key.startsWith('dict')) {
                                data[key] = raw; 
                            } else {
                                data[key] = normalizeBibleData(raw);
                            }
                            
                            loadedCount++;
                            setLoadingState(p => ({ ...p, loaded: loadedCount }));
                        } catch (e) {
                            console.error(`載入 ${key} 失敗:`, e);
                            setLoadingState(p => ({ ...p, text: `載入 ${key} 失敗` }));
                        }
                    }
                    
                    setLoadedBibles(data);
                    setAppReady(true);
                };
                
                loadData();
            }, []);

            useEffect(() => {
                if (darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [darkMode]);

            const chapterData = useMemo(() => {
                if (!appReady) return [];
                
                const bId = currentVerse.bookId;
                const ch = currentVerse.chapter;
                const activeVersions = [version1, version2, version3].filter(v => v !== 'none');
                
                let maxVerses = 0;
                activeVersions.forEach(v => {
                    if (loadedBibles[v] && loadedBibles[v][bId] && loadedBibles[v][bId][ch]) {
                        const verses = Object.keys(loadedBibles[v][bId][ch]).map(Number);
                        if (verses.length > 0) {
                            maxVerses = Math.max(maxVerses, Math.max(...verses));
                        }
                    }
                });
                
                if (maxVerses === 0) return [];
                
                const data = [];
                for (let v = 1; v <= maxVerses; v++) {
                    const verseData = { verseNum: v, bookId: bId, chapter: ch, texts: {}, original: {} };
                    
                    activeVersions.forEach(ver => {
                        const srcData = loadedBibles[ver]?.[bId]?.[ch]?.[v];
                        if (ver.startsWith('orig-')) {
                            verseData.original[ver] = srcData || '尚未匯入';
                        } else {
                            verseData.texts[ver] = srcData || '---';
                        }
                    });
                    
                    data.push(verseData);
                }
                
                return data;
            }, [appReady, currentVerse, version1, version2, version3, loadedBibles]);

            const handleWordClick = (word, versionConfig, verseData, wordIndex) => {
                const clean = word.replace(/[.,;·׃!?()[\]{}"'־…—\-]/g, '').trim();
                if (!clean || clean === '尚未匯入' || clean.includes('尚未')) return;

                let activeDict = 'dict-wlc-strongs';
                if (versionConfig === 'orig-lxx') activeDict = 'dict-lxx-strongs';
                if (versionConfig === 'orig-na28') activeDict = 'dict-na28-strongs';
                
                let targetMorphInfo = null;
                if (verseData && wordIndex !== undefined) {
                    let targetMorphDB = null;
                    if (versionConfig === 'orig-wlc') targetMorphDB = loadedBibles['morph-wlc'];
                    if (versionConfig === 'orig-na28') targetMorphDB = loadedBibles['morph-na28'];

                    if (targetMorphDB && targetMorphDB[verseData.bookId] && targetMorphDB[verseData.bookId][verseData.chapter] && targetMorphDB[verseData.bookId][verseData.chapter][verseData.verseNum]) {
                        const vData = targetMorphDB[verseData.bookId][verseData.chapter][verseData.verseNum];
                        if (Array.isArray(vData)) {
                             targetMorphInfo = vData[wordIndex];
                             if (targetMorphInfo && (targetMorphInfo.word || targetMorphInfo.text) && (targetMorphInfo.word || targetMorphInfo.text).replace(/[.,;·׃!?()[\]{}"'־…—\-]/g, '').trim() !== clean) {
                                 targetMorphInfo = vData.find(w => (w.word || w.text) && (w.word || w.text).replace(/[.,;·׃!?()[\]{}"'־…—\-]/g, '').trim() === clean) || null;
                             }
                        } else {
                            targetMorphInfo = vData[wordIndex] || vData[String(wordIndex)];
                        }
                    } else if (verseData.original && verseData.original[versionConfig] && Array.isArray(verseData.original[versionConfig])) {
                        const vData = verseData.original[versionConfig];
                        if (vData.length > 0 && typeof vData[0] === 'object') {
                            targetMorphInfo = vData[wordIndex];
                            if (targetMorphInfo && (targetMorphInfo.word || targetMorphInfo.text) && (targetMorphInfo.word || targetMorphInfo.text).replace(/[.,;·׃!?()[\]{}"'־…—\-]/g, '').trim() !== clean) {
                                 targetMorphInfo = vData.find(w => (w.word || w.text) && (w.word || w.text).replace(/[.,;·׃!?()[\]{}"'־…—\-]/g, '').trim() === clean) || null;
                            }
                        }
                    }
                }
                
                if (verseData && wordIndex !== undefined) {
                    setDictContext({
                        word: clean,
                        originalWord: word,
                        bookId: verseData.bookId,
                        chapter: verseData.chapter,
                        verseNum: verseData.verseNum,
                        wordIndex: wordIndex,
                        versionConfig: versionConfig
                    });
                } else {
                    setDictContext(null);
                }

                setDictTarget(activeDict);

            const dictionaryResults = useMemo(() => {
                if (!dictQuery) return [];
                
                const query = dictQuery.trim();
                if (!query) return [];
                
                const currentDictId = dictTarget;
                const isHebrewDict = currentDictId === 'dict-wlc-strongs';

                let contextMorph = null;
                if (dictContext) {

                    let targetMorphDB = null;
                    if (versionConfig === 'orig-wlc') targetMorphDB = loadedBibles['morph-wlc'];
                    if (versionConfig === 'orig-na28') targetMorphDB = loadedBibles['morph-na28'];

                    if (targetMorphDB && targetMorphDB[bookId] && targetMorphDB[bookId][chapter] && targetMorphDB[bookId][chapter][verseNum]) {
                        const vData = targetMorphDB[bookId][chapter][verseNum];
                        if (Array.isArray(vData)) {
                             contextMorph = vData[wordIndex];
                             if (contextMorph && (contextMorph.word || contextMorph.text) && (contextMorph.word || contextMorph.text).replace(/[.,;·׃!?()[\]{}"'־…—\-]/g, '').trim() !== query) {
                                 contextMorph = vData.find(w => (w.word || w.text) && (w.word || w.text).replace(/[.,;·׃!?()[\]{}"'־…—\-]/g, '').trim() === query) || null;
                             }
                        } else {
                            contextMorph = vData[wordIndex] || vData[String(wordIndex)];
                        }
                    } else if (versionConfig === 'orig-lxx' || versionConfig === 'orig-na28') {
                        const bibleData = loadedBibles[versionConfig];
                        if (bibleData && bibleData[bookId] && bibleData[bookId][chapter] && bibleData[bookId][chapter][verseNum]) {
                            const vData = bibleData[bookId][chapter][verseNum];
                            if (Array.isArray(vData) && vData.length > 0 && typeof vData[0] === 'object') {
                                contextMorph = vData[wordIndex];
                                if (contextMorph && (contextMorph.word || contextMorph.text) && (contextMorph.word || contextMorph.text).replace(/[.,;·׃!?()[\]{}"'־…—\-]/g, '').trim() !== query) {
                                     contextMorph = vData.find(w => (w.word || w.text) && (w.word || w.text).replace(/[.,;·׃!?()[\]{}"'־…—\-]/g, '').trim() === query) || null;
                                }
                            }
                        }
                    }
                }

                const removeDiacritics = (str) => {
                    if (!str) return '';
                    return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[\u0591-\u05C7]/g, ""); 
                };

                const normalizeFinalForms = (str) => {
                    if (!str) return '';
                    return str.replace(/ך/g, 'כ').replace(/ם/g, 'מ').replace(/ן/g, 'נ').replace(/ף/g, 'פ').replace(/ץ/g, 'צ');
                };

                const qClean = normalizeFinalForms(removeDiacritics(query.toLowerCase()));
                const qRaw = query.toLowerCase();
                const results = [];

                let explicitStrongs = null;
                let explicitLemma = null;
                let explicitGloss = null;
                let explicitEnglish = null;

                if (contextMorph) {
                    if (contextMorph.strongs) {
                        explicitStrongs = Array.isArray(contextMorph.strongs) ? String(contextMorph.strongs[0]) : String(contextMorph.strongs);
                    }
                    if (contextMorph.lemma || (contextMorph.lexicon && contextMorph.lexicon.lemma)) {
                        explicitLemma = normalizeFinalForms(removeDiacritics(contextMorph.lemma || contextMorph.lexicon.lemma));
                    }
                    explicitGloss = contextMorph.gloss || (contextMorph.lexicon && contextMorph.lexicon.gloss);
                    
                    if (contextMorph.english) {
                        explicitEnglish = String(contextMorph.english).replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    }
                }

                if (!loadedBibles[currentDictId]) {
                    if (contextMorph && (explicitLemma || qClean)) {
                        let sourceName = '內建解析';
                        if (contextMorph.english && !isHebrewDict) sourceName = 'NA28 形態學數據庫';
                        if ((contextMorph.lexicon || isHebrewDict) && contextMorph.gloss) sourceName = 'WLC 形態學數據庫';
                        if (currentDictId === 'dict-lxx-strongs') sourceName = 'LXX 內建解析';

                        results.push({
                            lemma: contextMorph.lemma || (contextMorph.lexicon && contextMorph.lexicon.lemma) || query,
                            strongs: explicitStrongs || '內建',
                            gloss: explicitGloss || explicitEnglish || '無翻譯',
                            definition: explicitEnglish ? `<span class="text-indigo-500 mr-1">內建翻譯:</span> ${explicitEnglish}` : '',
                            score: 2000,
                            isSynthesized: true,
                            source: sourceName,
                            morphology: contextMorph.morphology,
                            morph_code: contextMorph.morph_code,
                            pos: contextMorph.pos
                        });
                    }
                    return results;
                }

                const dict = loadedBibles[currentDictId];
                const getStrongConsonants = (str) => str.replace(/[אהוי]/g, '');

                for (const [strongs, data] of Object.entries(dict)) {
                    let score = 0;
                    const lemmaClean = normalizeFinalForms(removeDiacritics(data.lemma ? data.lemma.toLowerCase() : ''));
                    const lemmaRaw = data.lemma ? data.lemma.toLowerCase() : '';
                    
                    if (explicitStrongs && strongs === explicitStrongs) score += 1000;
                    if (explicitLemma && lemmaClean === explicitLemma) score += 500;

                    if (lemmaRaw === qRaw) score += 100;
                    else if (lemmaClean === qClean) score += 80;
                    else if (isHebrewDict && getStrongConsonants(lemmaClean) === getStrongConsonants(qClean) && qClean.length > 1) score += 50;

                    const strongDef = data.strongs_definition ? data.strongs_definition.toLowerCase() : '';
                    const htmlDef = data.definition ? data.definition.toLowerCase() : '';
                    const gloss = data.gloss ? data.gloss.toLowerCase() : '';

                    if (score === 0) {
                        if (strongDef.includes(qRaw) || htmlDef.includes(qRaw) || gloss.includes(qRaw)) {
                            score += 30;
                        }
                    }

                    if (score > 0) {
                        results.push({ ...data, strongs, score });
                    }
                }

                const exactMatch = explicitStrongs ? results.find(r => r.strongs === explicitStrongs) : null;

                if (contextMorph && (explicitLemma || qClean)) {
                    if (!exactMatch) {
                        let sourceName = '內建解析';
                        if (contextMorph.english && !isHebrewDict) sourceName = 'NA28 形態學數據庫';
                        if ((contextMorph.lexicon || isHebrewDict) && contextMorph.gloss) sourceName = 'WLC 形態學數據庫';
                        if (currentDictId === 'dict-lxx-strongs') sourceName = 'LXX 內建解析';

                        results.push({
                            lemma: contextMorph.lemma || (contextMorph.lexicon && contextMorph.lexicon.lemma) || query,
                            strongs: explicitStrongs || '內建',
                            gloss: explicitGloss || explicitEnglish || '無翻譯',
                            definition: explicitEnglish ? `<span class="text-indigo-500 mr-1">內建翻譯:</span> ${explicitEnglish}` : '',
                            score: 2000,
                            isSynthesized: true,
                            source: sourceName,
                            morphology: contextMorph.morphology,
                            morph_code: contextMorph.morph_code,
                            pos: contextMorph.pos,
                            derivation: contextMorph.derivation
                        });
                    } else {
                        exactMatch.morphology = contextMorph.morphology || exactMatch.morphology;
                        exactMatch.morph_code = contextMorph.morph_code || exactMatch.morph_code;
                        if (contextMorph.pos) exactMatch.pos = contextMorph.pos;
                        exactMatch.score = 2500; 
                    }
                }

                results.sort((a, b) => {
                    if (b.score !== a.score) return b.score - a.score;
                    return a.strongs.localeCompare(b.strongs);
                });

                return results.slice(0, 15);
            }, [dictQuery, dictTarget, loadedBibles, dictContext]);

            const getContextMorphology = () => {
                if (!dictContext) return null;
                
                try {
                    const { bookId, chapter, verseNum, wordIndex, versionConfig } = dictContext;
                    
                    let targetMorphDB = null;
                    if (versionConfig === 'orig-wlc') targetMorphDB = loadedBibles['morph-wlc'];
                    if (versionConfig === 'orig-na28') targetMorphDB = loadedBibles['morph-na28'];
                    
                    if (targetMorphDB && targetMorphDB[bookId] && targetMorphDB[bookId][chapter] && targetMorphDB[bookId][chapter][verseNum]) {
                        const vData = targetMorphDB[bookId][chapter][verseNum];
                        if (Array.isArray(vData)) {
                            let morphInfo = vData[wordIndex];
                            if (morphInfo && (morphInfo.word || morphInfo.text) && (morphInfo.word || morphInfo.text).replace(/[.,;·׃!?()[\]{}"'־…—\-]/g, '').trim() !== dictContext.word) {
                                morphInfo = vData.find(w => (w.word || w.text) && (w.word || w.text).replace(/[.,;·׃!?()[\]{}"'־…—\-]/g, '').trim() === dictContext.word) || null;
                            }
                            return morphInfo;
                        }
                        return vData[wordIndex] || vData[String(wordIndex)];
                    }

                    const bibleData = loadedBibles[versionConfig];
                    if (bibleData && bibleData[bookId] && bibleData[bookId][chapter] && bibleData[bookId][chapter][verseNum]) {
                        const vData = bibleData[bookId][chapter][verseNum];
                        if (Array.isArray(vData) && vData.length > 0 && typeof vData[0] === 'object') {
                            let morphInfo = vData[wordIndex];
                            if (morphInfo && (morphInfo.word || morphInfo.text) && (morphInfo.word || morphInfo.text).replace(/[.,;·׃!?()[\]{}"'־…—\-]/g, '').trim() !== dictContext.word) {
                                morphInfo = vData.find(w => (w.word || w.text) && (w.word || w.text).replace(/[.,;·׃!?()[\]{}"'־…—\-]/g, '').trim() === dictContext.word) || null;
                            }
                            return morphInfo;
                        }
                    }
                    
                    return null;
                } catch (e) {
                    return null;
                }
            };

            if (!appReady) return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-slate-50 dark:bg-slate-900">
                    <lucide.BookOpen className="w-16 h-16 text-blue-500 animate-pulse mb-6" />
                    <h2 className="text-2xl font-bold text-slate-800 dark:text-slate-200 mb-2">準備神聖的數據庫...</h2>
                    <div className="w-64 bg-slate-200 dark:bg-slate-700 rounded-full h-3 mb-4 overflow-hidden">
                        <div className="bg-blue-500 h-3 rounded-full transition-all duration-300" style={{ width: `${(loadingState.loaded / loadingState.total) * 100}%` }}></div>
                    </div>
                    <p className="text-slate-500 dark:text-slate-400 text-sm font-medium">{loadingState.text} ({loadingState.loaded}/{loadingState.total})</p>
                </div>
            );

            const activeVersions = [version1, version2, version3].filter(v => v !== 'none');
            const contextMorphologyData = getContextMorphology();
            const morphTags = contextMorphologyData ? parseMorphologyTags(contextMorphologyData) : [];

            return (
                <div className="flex h-screen overflow-hidden bg-slate-50 dark:bg-slate-900 transition-colors duration-300">
                    {/* 左側導航列 */}
                    <div className="w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col shadow-sm z-10 flex-shrink-0">
                        <div className="p-4 border-b border-slate-200 dark:border-slate-700 flex items-center gap-3 bg-gradient-to-r from-blue-50 to-white dark:from-slate-800 dark:to-slate-800">
                            <div className="bg-blue-500 p-2 rounded-lg shadow-sm">
                                <lucide.Library className="w-5 h-5 text-white" />
                            </div>
                            <h1 className="text-lg font-bold text-slate-800 dark:text-slate-100 tracking-tight">聖經原文探索器</h1>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-3 space-y-6">
                            <div>
                                <h3 className="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-3 px-2 flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-amber-500"></div> 舊約全書</h3>
                                <div className="grid grid-cols-5 gap-1.5">
                                    {BIBLE_STRUCTURE.OT.map(book => (
                                        <button 
                                            key={book.id}
                                            onClick={() => { setCurrentVerse({ bookId: book.id, chapter: 1 }); if (contentRef.current) contentRef.current.scrollTop = 0; }}
                                            className={`p-2 rounded-md text-xs font-medium transition-all ${currentVerse.bookId === book.id ? 'bg-amber-100 text-amber-800 dark:bg-amber-900/30 dark:text-amber-300 shadow-inner' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700'}`}
                                            title={book.name}
                                        >
                                            {book.abbr}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            <div>
                                <h3 className="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-3 px-2 flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-blue-500"></div> 新約全書</h3>
                                <div className="grid grid-cols-5 gap-1.5">
                                    {BIBLE_STRUCTURE.NT.map(book => (
                                        <button 
                                            key={book.id}
                                            onClick={() => { setCurrentVerse({ bookId: book.id, chapter: 1 }); if (contentRef.current) contentRef.current.scrollTop = 0; }}
                                            className={`p-2 rounded-md text-xs font-medium transition-all ${currentVerse.bookId === book.id ? 'bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-300 shadow-inner' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700'}`}
                                            title={book.name}

                                            {book.abbr}
                                        </button>
                                    ))}

                            </div>
                        </div>
                    </div>

                    {/* 右側主要內容區 */}
                    <div className="flex-1 flex flex-col relative overflow-hidden">
                        {/* 頂部工具列 */}
                        <div className="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 p-3 lg:p-4 flex flex-wrap items-center justify-between gap-4 shadow-sm z-10">
                            
                            {/* 章節選擇器 */}
                            <div className="flex items-center gap-2 lg:gap-3 bg-slate-50 dark:bg-slate-900 p-1.5 lg:p-2 rounded-xl border border-slate-200 dark:border-slate-700 shadow-inner">
                                <button 
                                    onClick={() => setCurrentVerse(p => ({...p, chapter: Math.max(1, p.chapter - 1)}))}
                                    className="p-1.5 hover:bg-white dark:hover:bg-slate-800 rounded-lg text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-colors shadow-sm"
                                    disabled={currentVerse.chapter <= 1}
                                >
                                    <lucide.ChevronLeft className="w-5 h-5" />
                                </button>
                                
                                <div className="font-bold text-lg lg:text-xl text-slate-800 dark:text-slate-100 min-w-[80px] text-center">
                                    {BIBLE_STRUCTURE.OT.concat(BIBLE_STRUCTURE.NT).find(b => b.id === currentVerse.bookId)?.name} <span className="text-blue-600 dark:text-blue-400">{currentVerse.chapter}</span>
                                </div>

                                <button 
                                    onClick={() => {
                                        const maxCh = BIBLE_STRUCTURE.OT.concat(BIBLE_STRUCTURE.NT).find(b => b.id === currentVerse.bookId)?.chapters;
                                        setCurrentVerse(p => ({...p, chapter: Math.min(maxCh, p.chapter + 1)}));
                                    }}
                                    className="p-1.5 hover:bg-white dark:hover:bg-slate-800 rounded-lg text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-colors shadow-sm"
                                    disabled={currentVerse.chapter >= BIBLE_STRUCTURE.OT.concat(BIBLE_STRUCTURE.NT).find(b => b.id === currentVerse.bookId)?.chapters}
                                >
                                    <lucide.ChevronRight className="w-5 h-5" />
                                </button>
                            </div>

                            {/* 版本控制區 */}
                            <div className="flex flex-wrap items-center gap-3">
                                <div className="flex gap-2 bg-slate-100 dark:bg-slate-900 p-1 rounded-lg border border-slate-200 dark:border-slate-700">
                                    <button onClick={() => setLayoutMode('column')} className={`p-1.5 rounded-md transition-all ${layoutMode === 'column' ? 'bg-white dark:bg-slate-800 shadow-sm text-blue-600 dark:text-blue-400' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`} title="直行對照"><lucide.AlignVerticalJustifyStart className="w-4 h-4" /></button>
                                    <button onClick={() => setLayoutMode('row')} className={`p-1.5 rounded-md transition-all ${layoutMode === 'row' ? 'bg-white dark:bg-slate-800 shadow-sm text-blue-600 dark:text-blue-400' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`} title="橫列對照"><lucide.AlignHorizontalJustifyStart className="w-4 h-4" /></button>
                                </div>

                                <div className="h-6 w-px bg-slate-300 dark:bg-slate-600 hidden sm:block"></div>

                                <div className="flex gap-2">
                                    <span className="text-sm font-semibold text-slate-700 dark:text-slate-300 self-center hidden sm:inline">對照 1:</span>
                                    <select 
                                        className="px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm font-medium shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50"
                                        value={version2} 
                                        onChange={(e) => setVersion2(e.target.value)}
                                    >
                                        <option value="cunp">和合本</option>
                                        <option value="rcuv">和合本修訂版</option>
                                        <option value="lzz">呂振中譯本</option>
                                        <option value="kjv">KJV</option>
                                        <optgroup label="原文 (依新舊約自動過濾)">
                                            {isOldTestament(currentVerse.bookId) ? (
                                                <>
                                                    <option value="orig-wlc">WLC 希伯來文 (舊約)</option>
                                                    <option value="orig-lxx">LXX 七十士希臘文 (舊約)</option>
                                                </>
                                            ) : (
                                                <option value="orig-na28">NA28 希臘文 (新約)</option>
                                            )}
                                        </optgroup>
                                    </select>
                                </div>

                                <div className="flex gap-2">
                                    <span className="text-sm font-semibold text-slate-700 dark:text-slate-300 self-center hidden sm:inline">對照 2:</span>
                                    <select 
                                        className="px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm font-medium shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50"
                                        value={version3} 
                                        onChange={(e) => setVersion3(e.target.value)}
                                    >
                                        <option value="none">無 (隱藏)</option>
                                        <option value="cunp">和合本</option>
                                        <option value="rcuv">和合本修訂版</option>
                                        <option value="lzz">呂振中譯本</option>
                                        <option value="kjv">KJV</option>
                                        <optgroup label="原文 (依新舊約自動過濾)">
                                            {isOldTestament(currentVerse.bookId) ? (
                                                <>
                                                    <option value="orig-wlc">WLC 希伯來文 (舊約)</option>
                                                    <option value="orig-lxx">LXX 七十士希臘文 (舊約)</option>
                                                </>
                                            ) : (
                                                <option value="orig-na28">NA28 希臘文 (新約)</option>
                                            )}
                                        </optgroup>
                                    </select>
                                </div>
                                
                                <button onClick={() => setDarkMode(!darkMode)} className="p-2 ml-auto lg:ml-0 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400 transition-colors">
                                    {darkMode ? <lucide.Sun className="w-5 h-5" /> : <lucide.Moon className="w-5 h-5" />}
                                </button>
                            </div>
                        </div>

                        {/* 經文閱讀區 */}
                        <div ref={contentRef} className="flex-1 overflow-y-auto p-4 lg:p-8 scroll-smooth pb-32">
                            <div className="max-w-5xl mx-auto space-y-6">
                                {chapterData.map((verse, idx) => (
                                    <div key={idx} className="flex flex-col sm:flex-row gap-4 p-4 lg:p-6 rounded-2xl bg-white dark:bg-slate-800/80 shadow-sm border border-slate-100 dark:border-slate-700/50 hover:shadow-md hover:border-blue-200 dark:hover:border-blue-800 transition-all duration-300 group">
                                        <div className="sm:w-16 flex-shrink-0 flex sm:flex-col items-center sm:items-end gap-2 text-slate-400 pt-1">
                                            <span className="text-sm font-bold bg-slate-100 dark:bg-slate-700/50 px-2.5 py-1 rounded-md">{verse.verseNum}</span>
                                        </div>
                                        
                                        <div className={`flex-1 ${layoutMode === 'column' ? 'flex flex-col gap-4' : 'grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6'} w-full`}>
                                            {activeVersions.map((vConfig, vIdx) => {
                                                const isOrig = vConfig.startsWith('orig-');
                                                const content = isOrig ? verse.original[vConfig] : verse.texts[vConfig];
                                                
                                                if (isOrig) {
                                                    const isHebrew = vConfig === 'orig-wlc';
                                                    return (
                                                        <div key={vIdx} className={`w-full ${isHebrew ? 'text-right' : 'text-left'}`}>
                                                            <div className="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2 select-none flex items-center gap-1.5 justify-start">
                                                                <div className={`w-1.5 h-1.5 rounded-full ${isHebrew ? 'bg-amber-500' : 'bg-blue-500'}`}></div> {vConfig.replace('orig-', '').toUpperCase()} 原文
                                                            </div>
                                                            <div className={`text-xl lg:text-2xl leading-loose flex flex-wrap gap-x-2.5 gap-y-3 ${isHebrew ? 'hebrew-text justify-start flex-row-reverse' : 'greek-text justify-start'}`}>
                                                                {Array.isArray(content) ? content.map((w, wIdx) => {
                                                                    const text = typeof w === 'string' ? w : (w.word || w.text || '---');
                                                                    const isPunctuation = /^[.,;·׃!?()[\]{}"'־…—\-]+$/.test(text);
                                                                    if (isPunctuation) return <span key={wIdx} className="text-slate-400 select-none self-end pb-1">{text}</span>;
                                                                    
                                                                    return (
                                                                        <span 
                                                                            key={wIdx} 
                                                                            onClick={() => handleWordClick(text, vConfig, verse, wIdx)}
                                                                            className={`cursor-pointer px-1.5 py-0.5 rounded transition-all duration-200 border-b-2 hover:bg-blue-50 dark:hover:bg-blue-900/30 active:scale-95 ${dictContext?.word === text.replace(/[.,;·׃!?()[\]{}"'־…—\-]/g, '').trim() ? 'bg-blue-100 border-blue-400 dark:bg-blue-800/50 dark:border-blue-500 font-bold' : 'border-transparent hover:border-slate-300 dark:hover:border-slate-600'}`}
                                                                        >
                                                                            {text}
                                                                        </span>
                                                                    );
                                                                }) : <span className="text-slate-400 italic text-base">無法解析此節原文格式</span>}
                                                            </div>
                                                        </div>
                                                    );
                                                } else {
                                                    return (
                                                        <div key={vIdx} className="w-full">
                                                            <div className="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2 select-none flex items-center gap-1.5">
                                                                <div className="w-1.5 h-1.5 rounded-full bg-slate-300 dark:bg-slate-600"></div> {vConfig.toUpperCase()}
                                                            </div>
                                                            <div className="text-[17px] lg:text-lg text-slate-800 dark:text-slate-200 leading-relaxed font-medium">
                                                                {content}
                                                            </div>
                                                        </div>
                                                    );
                                                }
                                            })}
                                        </div>
                                    </div>
                                ))}
                                {chapterData.length === 0 && (
                                    <div className="text-center py-20 text-slate-500 dark:text-slate-400 flex flex-col items-center">
                                        <lucide.SearchX className="w-12 h-12 mb-4 opacity-50" />
                                        <p>此章節沒有可用的經文資料</p>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* 字典彈窗面板 */}
                        {dictQuery && (
                            <div className="absolute bottom-4 right-4 lg:bottom-8 lg:right-8 w-[calc(100%-2rem)] sm:w-96 max-h-[75vh] bg-white/95 dark:bg-slate-800/95 backdrop-blur-xl border border-slate-200/50 dark:border-slate-700/50 rounded-2xl shadow-2xl flex flex-col z-50 animate-slide-up overflow-hidden ring-1 ring-black/5 dark:ring-white/10">
                                <div className="p-4 border-b border-slate-200/50 dark:border-slate-700/50 flex justify-between items-center bg-slate-50/50 dark:bg-slate-900/50 backdrop-blur-md sticky top-0 z-10">
                                    <div className="flex items-center gap-3">
                                        <div className="bg-blue-100 dark:bg-blue-900/50 p-2 rounded-lg">
                                            <lucide.Book className="w-5 h-5 text-blue-600 dark:text-blue-400" />
                                        </div>
                                        <div>
                                            <h3 className="font-bold text-lg text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                                <span className={dictTarget === 'dict-wlc-strongs' ? 'hebrew-text text-xl' : 'greek-text text-xl'}>{dictQuery}</span>
                                            </h3>
                                            <p className="text-xs text-slate-500 dark:text-slate-400 font-medium">
                                                {dictTarget === 'dict-wlc-strongs' ? '希伯來文解析' : dictTarget === 'dict-lxx-strongs' ? '七十士希臘文解析' : '新約希臘文解析'}
                                            </p>
                                        </div>
                                    </div>
                                    <button onClick={() => {setDictQuery(''); setDictContext(null);}} className="p-2 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full transition-colors text-slate-500">
                                        <lucide.X className="w-5 h-5" />
                                    </button>
                                </div>
                                
                                <div className="p-0 overflow-y-auto flex-1 custom-scrollbar">
                                    {morphTags.length > 0 && (
                                        <div className="p-4 bg-slate-50 dark:bg-slate-900/50 border-b border-slate-100 dark:border-slate-800">
                                            <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5"><lucide.Info className="w-3 h-3" /> 當前經文文法標籤</div>
                                            <div className="flex flex-wrap gap-1.5">
                                                {morphTags.map((tag, idx) => (
                                                    <span key={idx} className="px-2 py-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 text-xs rounded-md shadow-sm">{tag}</span>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {dictionaryResults.length > 0 ? (
                                       <div className="p-4 space-y-4">
                                           {dictionaryResults.map((r, i) => (
                                               <div key={i} className="bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 rounded-xl p-4 shadow-sm hover:shadow-md transition-shadow relative overflow-hidden group">
                                                  {i === 0 && <div className="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>}
                                                  
                                                  <div className="flex justify-between items-start mb-3">
                                                      <div className="flex flex-col">
                                                          <span className={`text-2xl font-bold text-slate-800 dark:text-slate-100 ${dictTarget === 'dict-wlc-strongs' ? 'hebrew-text' : 'greek-text'}`}>{r.lemma || dictQuery}</span>
                                                          {r.transliteration && <span className="text-xs font-mono text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/20 px-1.5 py-0.5 rounded mt-1 w-max">{r.transliteration}</span>}
                                                      </div>
                                                      <span className="text-xs font-mono font-bold px-2 py-1 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-lg border border-slate-200 dark:border-slate-600 flex items-center gap-1">
                                                          <lucide.Hash className="w-3 h-3" /> {r.strongs}
                                                      </span>
                                                  </div>
                                                  
                                                  {r.isSynthesized && r.source && (
                                                      <div className="mb-3">
                                                          <span className="inline-flex items-center gap-1 px-2 py-1 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 text-[10px] font-bold rounded border border-indigo-100 dark:border-indigo-800">
                                                              <lucide.Database className="w-3 h-3" /> 資料來源: {r.source}
                                                          </span>
                                                      </div>
                                                  )}

                                                  {r.strongs_definition && <p className="text-xs font-bold text-slate-700 dark:text-slate-300 leading-relaxed"><span className="text-slate-400 font-normal mr-1">定義:</span> {r.strongs_definition}</p>}
                                                  {r.definition && <div className="text-xs font-bold text-slate-700 dark:text-slate-300 leading-relaxed mt-1" dangerouslySetInnerHTML={{ __html: r.definition.includes('<span') ? r.definition : `<span class="text-slate-400 font-normal mr-1">定義:</span> ${r.definition}` }} />}
                                                  {r.derivation && r.derivation.toUpperCase() !== 'N/A' && r.derivation.toUpperCase() !== 'NONE' && <p className="text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed mt-1"><span className="font-normal mr-1">字源:</span> {r.derivation}</p>}
                                                  {r.kjv_definition && <p className="text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed mt-1"><span className="font-normal mr-1">KJV:</span> {r.kjv_definition}</p>}
                                                  {r.gloss && !r.strongs_definition && (!r.definition || r.isSynthesized) && <p className="text-xs font-bold text-slate-700 dark:text-slate-300 leading-relaxed mt-1"><span className="text-slate-400 font-normal mr-1">簡義:</span> {r.gloss}</p>}
                                               </div>
                                           ))}
                                       </div>
                                    ) : (
                                        <div className="p-8 text-center flex flex-col items-center justify-center text-slate-500 dark:text-slate-400">
                                            <div className="bg-slate-100 dark:bg-slate-800 p-3 rounded-full mb-3">
                                                <lucide.FileQuestion className="w-6 h-6" />
                                            </div>
                                            <p className="text-sm font-medium">字典中找不到對應資料</p>
                                            <p className="text-xs mt-1 opacity-70">可嘗試點擊其他單字</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
