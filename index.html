    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    animation: {
                        'fade-in': 'fadeIn 0.2s ease-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                        'spin-slow': 'spin 3s linear infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }

    </script>
    <style>
        body { background-color: #f8fafc; color: #0f172a; margin: 0; padding: 0; overflow: hidden; }
        .dark body { background-color: #0f172a; color: #f8fafc; }
        /* 隱藏捲軸但保持可捲動 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }

        .word-hover { transition: all 0.2s; cursor: pointer; border-radius: 4px; padding: 0 2px; }
        .word-hover:hover { background-color: #e2e8f0; }
        .dark .word-hover:hover { background-color: #334155; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const FILE_ENDPOINTS = {
            'cunp': 'https://raw.githubusercontent.com/FHLNET/dataset/master/bible/cunp.json',
            'rcuv': 'https://raw.githubusercontent.com/FHLNET/dataset/master/bible/rcuv.json',
            'lzz': 'https://raw.githubusercontent.com/FHLNET/dataset/master/bible/lzz.json',
            'kjv': 'https://raw.githubusercontent.com/FHLNET/dataset/master/bible/kjv.json',
            'orig-wlc': 'https://raw.githubusercontent.com/FHLNET/dataset/master/bible/orig-wlc.json',
            'orig-lxx': 'https://raw.githubusercontent.com/FHLNET/dataset/master/bible/orig-lxx.json',
            'orig-na28': 'https://raw.githubusercontent.com/FHLNET/dataset/master/bible/orig-na28.json',
            'morph-wlc': 'https://raw.githubusercontent.com/FHLNET/dataset/master/bible/morph-wlc.json',
            'morph-na28': 'https://raw.githubusercontent.com/FHLNET/dataset/master/bible/morph-na28.json',
            'dict-wlc-strongs': 'https://raw.githubusercontent.com/FHLNET/dataset/master/dictionary/hebrew_strongs.json',
            'dict-na28-strongs': 'https://raw.githubusercontent.com/FHLNET/dataset/master/dictionary/greek_strongs.json',
            'dict-lxx-strongs': 'https://raw.githubusercontent.com/FHLNET/dataset/master/dictionary/lxx_dictionary.json'
        };

        const BIBLE_STRUCTURE = {
            OT: [
                { id: "GEN", name: "創世記", abbr: "創", chapters: 50 }, { id: "EXO", name: "出埃及記", abbr: "出", chapters: 40 },
                { id: "LEV", name: "利未記", abbr: "利", chapters: 27 }, { id: "NUM", name: "民數記", abbr: "民", chapters: 36 },
                { id: "DEU", name: "申命記", abbr: "申", chapters: 34 }, { id: "JOS", name: "約書亞記", abbr: "書", chapters: 24 },
                { id: "JDG", name: "士師記", abbr: "士", chapters: 21 }, { id: "RUT", name: "路得記", abbr: "得", chapters: 4 },
                { id: "1SA", name: "撒母耳記上", abbr: "撒上", chapters: 31 }, { id: "2SA", name: "撒母耳記下", abbr: "撒下", chapters: 24 },
                { id: "1KI", name: "列王紀上", abbr: "王上", chapters: 22 }, { id: "2KI", name: "列王紀下", abbr: "王下", chapters: 25 },
                { id: "1CH", name: "歷代志上", abbr: "代上", chapters: 29 }, { id: "2CH", name: "歷代志下", abbr: "代下", chapters: 36 },
                { id: "EZR", name: "以斯拉記", abbr: "拉", chapters: 10 }, { id: "NEH", name: "尼希米記", abbr: "尼", chapters: 13 },
                { id: "EST", name: "以斯帖記", abbr: "斯", chapters: 10 }, { id: "JOB", name: "約伯記", abbr: "伯", chapters: 42 },
                { id: "PSA", name: "詩篇", abbr: "詩", chapters: 150 }, { id: "PRO", name: "箴言", abbr: "箴", chapters: 31 },
                { id: "ECC", name: "傳道書", abbr: "傳", chapters: 12 }, { id: "SNG", name: "雅歌", abbr: "歌", chapters: 8 },
                { id: "ISA", name: "以賽亞書", abbr: "賽", chapters: 66 }, { id: "JER", name: "耶利米書", abbr: "耶", chapters: 52 },
                { id: "LAM", name: "耶利米哀歌", abbr: "哀", chapters: 5 }, { id: "EZK", name: "以西結書", abbr: "結", chapters: 48 },
                { id: "DAN", name: "但以理書", abbr: "但", chapters: 12 }, { id: "HOS", name: "何西阿書", abbr: "何", chapters: 14 },
                { id: "JOL", name: "約珥書", abbr: "珥", chapters: 3 }, { id: "AMO", name: "阿摩司書", abbr: "摩", chapters: 9 },
                { id: "OBA", name: "俄巴底亞書", abbr: "俄", chapters: 1 }, { id: "JON", name: "約拿書", abbr: "拿", chapters: 4 },
                { id: "MIC", name: "彌迦書", abbr: "彌", chapters: 7 }, { id: "NAM", name: "那鴻書", abbr: "鴻", chapters: 3 },
                { id: "HAB", name: "哈巴谷書", abbr: "哈", chapters: 3 }, { id: "ZEP", name: "西番雅書", abbr: "番", chapters: 3 },
                { id: "HAG", name: "哈該書", abbr: "該", chapters: 2 }, { id: "ZEC", name: "撒迦利亞書", abbr: "亞", chapters: 14 },
                { id: "MAL", name: "瑪拉基書", abbr: "瑪", chapters: 4 }
            ],
            NT: [
                { id: "MAT", name: "馬太福音", abbr: "太", chapters: 28 }, { id: "MRK", name: "馬可福音", abbr: "可", chapters: 16 },
                { id: "LUK", name: "路加福音", abbr: "路", chapters: 24 }, { id: "JHN", name: "約翰福音", abbr: "約", chapters: 21 },
                { id: "ACT", name: "使徒行傳", abbr: "徒", chapters: 28 }, { id: "ROM", name: "羅馬書", abbr: "羅", chapters: 16 },
                { id: "1CO", name: "哥林多前書", abbr: "林前", chapters: 16 }, { id: "2CO", name: "哥林多後書", abbr: "林後", chapters: 13 },
                { id: "GAL", name: "加拉太書", abbr: "加", chapters: 6 }, { id: "EPH", name: "以弗所書", abbr: "弗", chapters: 6 },
                { id: "PHP", name: "腓立比書", abbr: "腓", chapters: 4 }, { id: "COL", name: "歌羅西書", abbr: "西", chapters: 4 },
                { id: "1TH", name: "帖撒羅尼迦前書", abbr: "帖前", chapters: 5 }, { id: "2TH", name: "帖撒羅尼迦後書", abbr: "帖後", chapters: 3 },
                { id: "1TI", name: "提摩太前書", abbr: "提前", chapters: 6 }, { id: "2TI", name: "提摩太後書", abbr: "提後", chapters: 4 },
                { id: "TIT", name: "提多書", abbr: "多", chapters: 3 }, { id: "PHM", name: "腓利門書", abbr: "門", chapters: 1 },
                { id: "HEB", name: "希伯來書", abbr: "來", chapters: 13 }, { id: "JAS", name: "雅各書", abbr: "雅", chapters: 5 },
                { id: "1PE", name: "彼得前書", abbr: "彼前", chapters: 5 }, { id: "2PE", name: "彼得後書", abbr: "彼後", chapters: 3 },
                { id: "1JN", name: "約翰一書", abbr: "約一", chapters: 5 }, { id: "2JN", name: "約翰二書", abbr: "約二", chapters: 1 },
                { id: "3JN", name: "約翰三書", abbr: "約三", chapters: 1 }, { id: "JUD", name: "猶大書", abbr: "猶", chapters: 1 },
                { id: "REV", name: "啟示錄", abbr: "啟", chapters: 22 }
            ]
        };

        const THEMES = {
            zinc: { primary: 'slate-900', secondary: 'slate-100', accent: 'blue-600', ring: 'slate-200' },
            sepia: { primary: 'amber-900', secondary: 'amber-50', accent: 'amber-700', ring: 'amber-200' },
            sky: { primary: 'sky-900', secondary: 'sky-50', accent: 'sky-600', ring: 'sky-200' }
        };

        const App = () => {
            const [currentVerse, setCurrentVerse] = useState({ bookId: 'GEN', chapter: 1 });
            const [version1, setVersion1] = useState('cunp');
            const [version2, setVersion2] = useState('orig-wlc');
            const [version3, setVersion3] = useState('none');
            const [layoutMode, setLayoutMode] = useState('column'); // 'column' or 'row'
            const [darkMode, setDarkMode] = useState(false);
            const [activeTheme, setActiveTheme] = useState('zinc');
            
            const [loadedBibles, setLoadedBibles] = useState({});
            const [loadingState, setLoadingState] = useState({ total: 0, loaded: 0, text: '' });
            const [appReady, setAppReady] = useState(false);

            const [dictQuery, setDictQuery] = useState('');
            const [dictTarget, setDictTarget] = useState('dict-wlc-strongs');
            const [dictContext, setDictContext] = useState(null); 
            const [sidebarOpen, setSidebarOpen] = useState(true);

            // --- 🤖 智慧連動：新舊約判斷與版本自動切換 ---
            const isOldTestament = (bookId) => {
                return BIBLE_STRUCTURE.OT.some(b => b.id === bookId);
            };

            useEffect(() => {
                const checkAndAutoSwitchVersion = () => {
                    const isOT = isOldTestament(currentVerse.bookId);
                    
                    // 自動修正版本 2
                    if (isOT && version2 === 'orig-na28') {
                        setVersion2('orig-wlc');
                    } else if (!isOT && (version2 === 'orig-wlc' || version2 === 'orig-lxx')) {
                        setVersion2('orig-na28');
                    }

                    // 自動修正版本 3
                    if (version3 !== 'none') {
                        if (isOT && version3 === 'orig-na28') {
                            setVersion3('orig-wlc');
                        } else if (!isOT && (version3 === 'orig-wlc' || version3 === 'orig-lxx')) {
                            setVersion3('orig-na28');
                        }
                        
                        // 防呆：如果自動切換後 version2 跟 version3 撞名，隱藏 version3
                        if (version2 === version3) {
                            setVersion3('none');
                        }
                    }
                };
                checkAndAutoSwitchVersion();
            }, [currentVerse.bookId]); // 只有當章節書卷改變時才自動切換

            const parseMorphologyTags = (rawCodeOrObj) => {
                if (!rawCodeOrObj) return [];
                
                let tags = [];
                const addTag = (tag) => { if (tag && !tags.includes(tag)) tags.push(tag); };

                // 處理 NA28 新格式
                if (rawCodeOrObj && rawCodeOrObj.morphology && typeof rawCodeOrObj.morphology === 'string' && rawCodeOrObj.morphology.includes('=')) {
                    rawCodeOrObj.morphology.split(';').forEach(part => {
                        const cleanPart = part.trim();
                        if (cleanPart) {
                            const [key, val] = cleanPart.split('=');
                            if (key && val) {
                                const transMap = {
                                    'Function': '功能', 'Verb': '動詞', 'Noun': '名詞', 'Adjective': '形容詞', 'Conjunction': '連接詞', 'Article': '冠詞', 'Preposition': '介系詞', 'Interjection': '感嘆詞', 'Particle': '助詞', 'Pronoun': '代名詞', 'Relative pronoun': '關係代名詞', 'Definite article': '定冠詞', 'Personal pronoun': '人稱代名詞', 'Demonstrative pronoun': '指示代名詞', 'Reflexive pronoun': '反身代名詞', 'Interrogative pronoun': '疑問代名詞', 'Possessive pronoun': '所有格代名詞', 'Particle or Disjunctive': '助詞或反義詞',
                                    'Tense': '時態', 'Present': '現在式', 'Aorist': '不定過去式', 'Imperfect': '未完成式', 'Perfect': '完成式', 'Future': '未來式', 'Pluperfect': '過去完成式', '2nd Aorist': '第二不定過去式', '2nd Future': '第二未來式',
                                    'Voice': '語態', 'Active': '主動', 'Passive': '被動', 'Middle': '關身', 'Middle Deponent': '關身異態', 'Passive Deponent': '被動異態', 'Middle or Passive Deponent': '關/被異態', 'Middle or Passive': '關身或被動',
                                    'Mood': '語氣', 'Indicative': '直陳', 'Subjunctive': '假設', 'Imperative': '祈使', 
                                    'Form': '形式', 'Participle': '分詞', 'Infinitive': '不定詞',
                                    'Person': '人稱', '1st': '第一', '2nd': '第二', '3rd': '第三',
                                    'Number': '單複', 'Singular': '單數', 'Plural': '複數',
                                    'Case': '格位', 'Nominative': '主格', 'Genitive': '屬格', 'Dative': '與格', 'Accusative': '賓格', 'Vocative': '呼格',
                                    'Gender': '性別', 'Masculine': '陽性', 'Feminine': '陰性', 'Neuter': '中性',
                                    'Extra': '補充', 'Negative': '否定', 'Interrogative': '疑問', 'Contracted form': '縮寫形式',
                                    'Name type': '專名類型', 'Person Gentilic': '人名/族名', 'Location Gentilic': '地名/族名', 'Location': '地名', 'Individual': '人名', 'Title': '頭銜',
                                    'Adj.Numb.': '數字屬性', 'Indeclinable Numeral': '不變形數字',
                                    'Original language': '原始語言', 'Transcribed from Hebrew': '譯自希伯來文'
                                };
                                const transKey = transMap[key.trim()] || key.trim();
                                const transVal = transMap[val.trim()] || val.trim();
                                addTag(`${transKey}: ${transVal}`);
                            } else {
                                addTag(cleanPart);
                            }
                        }
                    });
                    
                    if (rawCodeOrObj.pos && !rawCodeOrObj.morphology.includes('Function=')) addTag(`詞性: ${rawCodeOrObj.pos}`);
                    if (rawCodeOrObj.morph_code) addTag(`代碼: ${rawCodeOrObj.morph_code}`);
                    
                    if (tags.length > 0) return tags;
                }

                // 處理自訂 morph_analysis 結構 (WLC/LXX)
                if (rawCodeOrObj && typeof rawCodeOrObj === 'object' && rawCodeOrObj.morph_analysis && rawCodeOrObj.morph_analysis.parts) {
                    rawCodeOrObj.morph_analysis.parts.forEach(part => {
                        const posMap = { 'noun': '名詞', 'verb': '動詞', 'adjective': '形容詞', 'adverb': '副詞', 'pronoun': '代名詞', 'preposition': '介系詞', 'conjunction': '連接詞', 'interjection': '感嘆詞', 'particle': '助詞', 'article': '冠詞' };
                        if (part.pos && posMap[part.pos.toLowerCase()]) addTag(`詞性: ${posMap[part.pos.toLowerCase()]}`); else if (part.pos) addTag(`詞性: ${part.pos}`);
                        
                        const genderMap = { 'masculine': '陽性', 'feminine': '陰性', 'common': '通性' };
                        if (part.gender && genderMap[part.gender.toLowerCase()]) addTag(genderMap[part.gender.toLowerCase()]); else if (part.gender) addTag(part.gender);
                        
                        const numMap = { 'singular': '單數', 'plural': '複數', 'dual': '雙數' };
                        if (part.number && numMap[part.number.toLowerCase()]) addTag(numMap[part.number.toLowerCase()]); else if (part.number) addTag(part.number);
                        
                        const stateMap = { 'absolute': '絕對態', 'construct': '附屬態' };
                        if (part.state && stateMap[part.state.toLowerCase()]) addTag(stateMap[part.state.toLowerCase()]);
                        
                        const stemMap = { 'qal': 'Qal(輕)', 'niphal': 'Niphal(被動)', 'piel': 'Piel(強調)', 'pual': 'Pual(強被)', 'hiphil': 'Hiphil(使役)', 'hophal': 'Hophal(使被)', 'hithpael': 'Hithpael(反身)' };
                        if (part.stem && stemMap[part.stem.toLowerCase()]) addTag(`語幹: ${stemMap[part.stem.toLowerCase()]}`);
                        
                        const conjMap = { 'perfect': '完成式', 'imperfect': '未完成式', 'sequential imperfect': '連續未完成式', 'imperative': '祈使語氣', 'infinitive construct': '附屬不定詞', 'infinitive absolute': '絕對不定詞', 'participle': '分詞' };
                        if (part.conjugation && conjMap[part.conjugation.toLowerCase()]) addTag(`語氣: ${conjMap[part.conjugation.toLowerCase()]}`); else if (part.conjugation) addTag(`語氣: ${part.conjugation}`);
                        
                        const personMap = { '1st': '第一人稱', '2nd': '第二人稱', '3rd': '第三人稱' };
                        if (part.person && personMap[part.person.toLowerCase()]) addTag(personMap[part.person.toLowerCase()]);
                    });
                    
                    if (tags.length > 0) return tags;
                }

                // 備用字串解析與 N/A 過濾
                let rawCode = '';
                let posRaw = '';
                
                if (typeof rawCodeOrObj === 'object') {
                   rawCode = String(rawCodeOrObj.morph_code || rawCodeOrObj.morphology_code || rawCodeOrObj.morphology || rawCodeOrObj.morphology_full || (rawCodeOrObj.morphology_detail && rawCodeOrObj.morphology_detail.code) || rawCodeOrObj.morph || '').trim();
                   posRaw = String(rawCodeOrObj.part_of_speech || rawCodeOrObj.pos || (rawCodeOrObj.morphology_detail && rawCodeOrObj.morphology_detail.pos) || '').trim();
                } else {
                   rawCode = String(rawCodeOrObj).trim();
                }

                if (rawCode.toUpperCase() === 'N/A' || rawCode.toUpperCase() === 'NONE') rawCode = '';
                if (posRaw.toUpperCase() === 'N/A' || posRaw.toUpperCase() === 'NONE') posRaw = '';

                const fullTermMap = {
                    'noun': '名詞', 'verb': '動詞', 'adj': '形容詞', 'adjective': '形容詞', 'adv': '副詞', 'adverb': '副詞',
                    'prep': '介系詞', 'conj': '連接詞', 'pron': '代名詞', 'art': '冠詞', 'part': '助詞', 'intj': '感嘆詞',
                    'masc': '陽性', 'masculine': '陽性', 'fem': '陰性', 'feminine': '陰性', 'neut': '中性', 'common': '通性',
                    'sing': '單數', 'singular': '單數', 'plur': '複數', 'plural': '複數', 'dual': '雙數',
                    'nom': '主格', 'gen': '屬格', 'dat': '與格', 'acc': '賓格', 'voc': '呼格',
                    'pres': '現在式', 'impf': '未完成式', 'fut': '未來式', 'aor': '不定過去式', 'perf': '完成式', 'plup': '過去完成式',
                    'act': '主動', 'mid': '關身', 'pass': '被動', 'ind': '直陳', 'subj': '假設', 'opt': '祈願', 'impv': '祈使', 'inf': '不定詞', 'ptcp': '分詞'
                };

                Object.entries(fullTermMap).forEach(([en, zh]) => {
                    if (new RegExp(`\\b${en}\\b`).test(rawCode.toLowerCase()) || new RegExp(`\\b${en}\\b`).test(posRaw.toLowerCase())) {
                        addTag(zh);
                    }
                });

                if (tags.length === 0) {
                    if (posRaw) tags.push(posRaw.includes('詞') || posRaw.includes('(') ? posRaw : `詞性: ${posRaw}`);
                    if (rawCode && rawCode !== posRaw) tags.push(`文法: ${rawCode}`);
                    if (typeof rawCodeOrObj === 'string' && rawCodeOrObj && rawCode.toUpperCase() !== 'N/A') tags.push(rawCodeOrObj);
                }

                return tags;
            };

            const normalizeBibleData = (rawJson) => {
                const result = {}; 
                
                if (rawJson && typeof rawJson === 'object' && !Array.isArray(rawJson)) {
                    const keys = Object.keys(rawJson);
                    if (keys.length > 0 && /^[GH]\d+/.test(keys[0])) return rawJson;
                }

                const allBooks = [...BIBLE_STRUCTURE.OT, ...BIBLE_STRUCTURE.NT];
                const bookMap = {};
                allBooks.forEach(b => {
                    bookMap[b.name] = b.id; bookMap[b.en] = b.id; bookMap[b.abbr] = b.id;
                    bookMap[b.en.toUpperCase()] = b.id; bookMap[b.abbr.toUpperCase()] = b.id;
                });

                const ALIASES = {
                  '1CHR': '1CH', '2CHR': '2CH', '1SAM': '1SA', '2SAM': '2SA', '1KGS': '1KI', '2KGS': '2KI', 
                  'PSALM': 'PSA', 'SONG': 'SNG', 'CANTICLES': 'SNG', 'EZEK': 'EZK', 'MATT': 'MAT', 'MARK': 'MRK',
                  'LUKE': 'LUK', 'JOHN': 'JHN', '1COR': '1CO', '2COR': '2CO', '1THESS': '1TH', '2THESS': '2TH', 
                  '1TIM': '1TI', '2TIM': '2TI', 'PHILEM': 'PHM', 'HEB': 'HEB', 'JAMES': 'JAS', '1PET': '1PE',
                  '2PET': '2PE', '1JOHN': '1JN', '2JOHN': '2JN', '3JOHN': '3JN', 'REV': 'REV'
                };
                
                const parseVerseRef = (refStr) => {
                    if (!refStr) return null;
                    const parts = refStr.split('.');
                    if (parts.length >= 3) {
                        return { bookAbbr: parts[0], chapter: parseInt(parts[1]), verse: parseInt(parts[2]) };
                    }
                    return null;
                };

                const getBookId = (name) => {
                    if (!name) return null;
                    let n = String(name).trim();
                    let upper = n.toUpperCase();
                    if (ALIASES[upper]) return ALIASES[upper];
                    if (bookMap[n]) return bookMap[n];
                    if (bookMap[upper]) return bookMap[upper];
                    const found = allBooks.find(b => b.name === n || b.en.toUpperCase() === upper || b.abbr.toUpperCase() === upper);
                    return found ? found.id : null;
                };

                const ensurePath = (bId, ch) => {
                  if(!result[bId]) result[bId] = {};
                  if(!result[bId][ch]) result[bId][ch] = {};
                };

                try {
                    // NA28 全新格式： { "Act.1.1": [ { "word": "...", ... } ] }
                    if (typeof rawJson === 'object' && !Array.isArray(rawJson)) {
                        const firstKey = Object.keys(rawJson)[0];
                        if (firstKey && firstKey.includes('.') && Array.isArray(rawJson[firstKey])) {
                            for (const verseRef in rawJson) {
                                const ref = parseVerseRef(verseRef);
                                if (ref) {
                                    const bId = getBookId(ref.bookAbbr);
                                    if (bId) {
                                        ensurePath(bId, ref.chapter);
                                        result[bId][ref.chapter][ref.verse] = rawJson[verseRef];
                                    }
                                }
                            }
                            return result;
                        }
                    }

                    // 舊格式： { "1Chr": [ { "verse": "1Chr.1.1", "words": [...] } ] }
                    if (typeof rawJson === 'object' && !Array.isArray(rawJson)) {
                        const firstKey = Object.keys(rawJson)[0];
                        if (firstKey && Array.isArray(rawJson[firstKey]) && rawJson[firstKey][0] && rawJson[firstKey][0].verse && rawJson[firstKey][0].words) {
                            for (const bookKey in rawJson) {
                                const bId = getBookId(bookKey);
                                if (bId) {
                                    rawJson[bookKey].forEach(verseObj => {
                                        const ref = parseVerseRef(verseObj.verse);
                                        if (ref) {
                                            ensurePath(bId, ref.chapter);
                                            result[bId][ref.chapter][ref.verse] = verseObj.words;
                                        }
                                    });
                                }
                            }
                            return result;
                        }
                    }

                    // 格式 A: 陣列 [{book_name, chapter, verse, text}]
                    if (Array.isArray(rawJson)) {
                        rawJson.forEach(item => {
                            const bId = getBookId(item.book_name || item.book);
                            if (bId) {
                                ensurePath(bId, item.chapter);
                                result[bId][item.chapter][item.verse] = item.text || item.words || item;
                            }
                        });
                        return result;
                    }

                    // 格式 B/C 容錯處理
                    for (const key in rawJson) {
                        const bId = getBookId(key);
                        if (bId) {
                            result[bId] = {};
                            for (const ch in rawJson[key]) {
                                result[bId][ch] = {};
                                for (const v in rawJson[key][ch]) {
                                    result[bId][ch][v] = rawJson[key][ch][v];
                                }
                            }
                        }
                    }
                    return Object.keys(result).length > 0 ? result : rawJson;

                } catch (e) {
                    console.error("JSON normalization error:", e);
                    return rawJson;
                }
            };

            useEffect(() => {
                const loadAllData = async () => {
                    const keys = Object.keys(FILE_ENDPOINTS);
                    setLoadingState({ total: keys.length, loaded: 0, text: '準備載入資料庫...' });
                    
                    const loadedData = {};
                    let currentLoaded = 0;

                    for (const key of keys) {
                        setLoadingState(prev => ({ ...prev, text: `載入中: ${key}...` }));
                        try {
                            const res = await fetch(FILE_ENDPOINTS[key]);
                            const json = await res.json();
                            loadedData[key] = normalizeBibleData(json);
                        } catch (err) {
                            console.error(`Failed to load ${key}:`, err);
                            loadedData[key] = null;
                        }
                        currentLoaded++;
                        setLoadingState(prev => ({ ...prev, loaded: currentLoaded }));
                    }

                    setLoadedBibles(loadedData);
                    setAppReady(true);
                };

                loadAllData();
            }, []);

            useEffect(() => {
                if (darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [darkMode]);

            const handleWordClick = (word, versionConfig, verseData, wordIndex) => {
                const clean = word.replace(/[.,;·׃!?()[\]{}"'־…—\-]/g, '').trim();
                if (!clean || clean === '尚未匯入' || clean.includes('尚未')) return;

                let activeDict = 'dict-wlc-strongs';
                if (versionConfig === 'orig-lxx') activeDict = 'dict-lxx-strongs';
                if (versionConfig === 'orig-na28') activeDict = 'dict-na28-strongs';
                
                let targetMorphInfo = null;
                if (verseData && wordIndex !== undefined) {
                    let targetMorphDB = null;
                    if (versionConfig === 'orig-wlc') targetMorphDB = loadedBibles['morph-wlc'];
                    if (versionConfig === 'orig-na28') targetMorphDB = loadedBibles['morph-na28'];

                    if (targetMorphDB && targetMorphDB[verseData.bookId] && targetMorphDB[verseData.bookId][verseData.chapter] && targetMorphDB[verseData.bookId][verseData.chapter][verseData.verseNum]) {
                        const vData = targetMorphDB[verseData.bookId][verseData.chapter][verseData.verseNum];
                        if (Array.isArray(vData)) {
                             targetMorphInfo = vData[wordIndex];
                             if (targetMorphInfo && (targetMorphInfo.word || targetMorphInfo.text) && (targetMorphInfo.word || targetMorphInfo.text).replace(/[.,;·׃!?()[\]{}"'־…—\-]/g, '').trim() !== clean) {
                                 targetMorphInfo = vData.find(w => (w.word || w.text) && (w.word || w.text).replace(/[.,;·׃!?()[\]{}"'־…—\-]/g, '').trim() === clean) || null;
                             }
                        } else {
                            targetMorphInfo = vData[wordIndex] || vData[String(wordIndex)];
                        }
                    } else if (verseData.original && verseData.original[versionConfig] && Array.isArray(verseData.original[versionConfig])) {
                        const vData = verseData.original[versionConfig];
                        if (vData.length > 0 && typeof vData[0] === 'object') {
                            targetMorphInfo = vData[wordIndex];
                            if (targetMorphInfo && (targetMorphInfo.word || targetMorphInfo.text) && (targetMorphInfo.word || targetMorphInfo.text).replace(/[.,;·׃!?()[\]{}"'־…—\-]/g, '').trim() !== clean) {
                                 targetMorphInfo = vData.find(w => (w.word || w.text) && (w.word || w.text).replace(/[.,;·׃!?()[\]{}"'־…—\-]/g, '').trim() === clean) || null;
                            }
                        }
                    }
                }
                
                if (verseData && wordIndex !== undefined) {
                    setDictContext({
                        word: clean,
                        originalWord: word,
                        bookId: verseData.bookId,
                        chapter: verseData.chapter,
                        verseNum: verseData.verseNum,
                        wordIndex: wordIndex,
                        versionConfig: versionConfig,
                        morphInfo: targetMorphInfo // 直接綁定精確的形態學資料
                    });
                } else {
                    setDictContext(null);
                }

                setDictTarget(activeDict);
                setDictQuery(clean); 
            };

            const searchDictionary = (query, currentDictId) => {
                if (!query) return [];
                const qClean = query.replace(/[.,;·׃!?()[\]{}"'־…—\-]/g, '').trim();
                if (!qClean) return [];

                const results = [];
                const isHebrewDict = currentDictId.includes('hebrew') || currentDictId === 'dict-wlc-strongs';
                
                let contextMorph = null;
                if (dictContext) {
                    contextMorph = dictContext.morphInfo;
                }

                let explicitStrongs = null;
                let explicitLemma = null;
                let explicitGloss = null;
                let explicitEnglish = null;

                if (contextMorph) {
                    if (contextMorph.strongs) {
                        explicitStrongs = Array.isArray(contextMorph.strongs) ? String(contextMorph.strongs[0]) : String(contextMorph.strongs);
                    }
                    if (contextMorph.lemma || (contextMorph.lexicon && contextMorph.lexicon.lemma)) {
                        explicitLemma = (contextMorph.lemma || contextMorph.lexicon.lemma).normalize('NFC');
                    }
                    explicitGloss = contextMorph.gloss || (contextMorph.lexicon && contextMorph.lexicon.gloss);
                    if (contextMorph.english) {
                        explicitEnglish = String(contextMorph.english).replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    }
                }

                if (!loadedBibles[currentDictId]) {
                    if (contextMorph && (explicitLemma || qClean)) {
                        let sourceName = '內建解析';
                        if (contextMorph.english && !isHebrewDict) sourceName = 'NA28 形態學數據庫';
                        if ((contextMorph.lexicon || isHebrewDict) && contextMorph.gloss) sourceName = 'WLC 形態學數據庫';
                        if (currentDictId === 'dict-lxx-strongs') sourceName = 'LXX 內建解析';

                        results.push({
                            lemma: contextMorph.lemma || (contextMorph.lexicon && contextMorph.lexicon.lemma) || query,
                            strongs: explicitStrongs || '內建',
                            gloss: explicitGloss || explicitEnglish || '無翻譯',
                            definition: explicitEnglish ? `<span class="text-indigo-500 mr-1">內建翻譯:</span> ${explicitEnglish}` : '',
                            score: 2000,
                            isSynthesized: true,
                            source: sourceName,
                            morphology: contextMorph.morphology,
                            morph_code: contextMorph.morph_code,
                            pos: contextMorph.pos
                        });
                    }
                    return results;
                }

                const dict = loadedBibles[currentDictId];
                
                const removeDiacritics = (str) => {
                    if (!str) return '';
                    return str.normalize('NFD').replace(/[\u0300-\u036f\u0591-\u05C7\u1DC0-\u1DFF]/g, '').toLowerCase();
                };

                const getStrongConsonants = (str) => str.replace(/[אהוי]/g, '');

                const qRaw = query.toLowerCase();
                const qNorm = removeDiacritics(qRaw);
                const qCons = isHebrewDict ? getStrongConsonants(qNorm) : qNorm;
                
                const lemmaNormMatch = explicitLemma ? removeDiacritics(explicitLemma) : null;

                for (const [strongs, data] of Object.entries(dict)) {
                    let score = 0;
                    const lemma = (data.lemma || '').toLowerCase();
                    const lemmaNorm = removeDiacritics(lemma);
                    const lemmaCons = isHebrewDict ? getStrongConsonants(lemmaNorm) : lemmaNorm;
                    const strongDef = (data.strongs_definition || '').toLowerCase();
                    const htmlDef = (data.definition || '').toLowerCase();
                    const gloss = (data.gloss || '').toLowerCase();
                    const translit = (data.transliteration || '').toLowerCase();

                    if (explicitStrongs && strongs === explicitStrongs) score += 1000;
                    if (lemmaNormMatch && lemmaNorm === lemmaNormMatch) score += 500;
                    
                    if (qClean === strongs) score += 800;
                    if (qRaw === lemma) score += 500;
                    if (qNorm === lemmaNorm) score += 300;
                    if (isHebrewDict && qCons === lemmaCons && qCons.length > 2) score += 100;
                    if (translit === qNorm) score += 100;

                    if (score === 0) {
                        if (strongDef.includes(qRaw) || htmlDef.includes(qRaw) || gloss.includes(qRaw)) {
                            score += 30;
                        }
                    }

                    if (score > 0) {
                        results.push({ ...data, strongs, score });
                    }
                }

                const exactMatch = explicitStrongs ? results.find(r => r.strongs === explicitStrongs) : null;

                if (contextMorph && (explicitLemma || qClean)) {
                    if (!exactMatch) {
                        let sourceName = '內建解析';
                        if (contextMorph.english && !isHebrewDict) sourceName = 'NA28 形態學數據庫';
                        if ((contextMorph.lexicon || isHebrewDict) && contextMorph.gloss) sourceName = 'WLC 形態學數據庫';
                        if (currentDictId === 'dict-lxx-strongs') sourceName = 'LXX 內建解析';

                        results.push({
                            lemma: contextMorph.lemma || (contextMorph.lexicon && contextMorph.lexicon.lemma) || query,
                            strongs: explicitStrongs || '內建',
                            gloss: explicitGloss || explicitEnglish || '無翻譯',
                            definition: explicitEnglish ? `<span class="text-indigo-500 mr-1">內建翻譯:</span> ${explicitEnglish}` : '',
                            score: 2000,
                            isSynthesized: true,
                            source: sourceName,
                            morphology: contextMorph.morphology,
                            morph_code: contextMorph.morph_code,
                            pos: contextMorph.pos
                        });
                    } else {
                        exactMatch.morphology = contextMorph.morphology || exactMatch.morphology;
                        exactMatch.morph_code = contextMorph.morph_code || exactMatch.morph_code;
                        if (contextMorph.pos) exactMatch.pos = contextMorph.pos;
                        exactMatch.score = 2500; 
                    }
                }

                results.sort((a, b) => b.score - a.score);
                return results.slice(0, 15);
            };

            const compileChapterData = () => {
                if (!appReady) return [];
                const { bookId, chapter } = currentVerse;
                
                let v1Data = loadedBibles[version1]?.[bookId]?.[chapter] || {};
                let verses = [];
                let maxVerse = 0;

                const getVersesCount = (dataMap) => {
                    if(!dataMap) return 0;
                    return Math.max(...Object.keys(dataMap).map(Number).filter(n => !isNaN(n)), 0);
                };

                maxVerse = Math.max(
                    getVersesCount(v1Data),
                    getVersesCount(loadedBibles[version2]?.[bookId]?.[chapter]),
                    version3 !== 'none' ? getVersesCount(loadedBibles[version3]?.[bookId]?.[chapter]) : 0
                );

                for (let i = 1; i <= (maxVerse || 30); i++) {
                    const extractText = (ver, db) => {
                        const cell = db?.[bookId]?.[chapter]?.[i];
                        if (!cell) return null;
                        if (typeof cell === 'string') return cell;
                        if (Array.isArray(cell)) {
                            // NA28, LXX, WLC 結構處理
                            return cell.map(w => w.word || w.text || w).join(' ');
                        }
                        return cell.text || JSON.stringify(cell);
                    };

                    const getOriginalArray = (ver, db) => {
                         const cell = db?.[bookId]?.[chapter]?.[i];
                         if (Array.isArray(cell)) return cell;
                         if (typeof cell === 'string') return cell.split(' ');
                         return [];
                    };

                    verses.push({
                        verseNum: i,
                        bookId: bookId,
                        chapter: chapter,
                        v1Text: extractText(version1, loadedBibles[version1]) || '...',
                        v2Text: extractText(version2, loadedBibles[version2]) || '...',
                        v3Text: version3 !== 'none' ? (extractText(version3, loadedBibles[version3]) || '...') : null,
                        original: {
                            [version2]: getOriginalArray(version2, loadedBibles[version2]),
                            ...(version3 !== 'none' ? { [version3]: getOriginalArray(version3, loadedBibles[version3]) } : {})
                        }
                    });
                }
                return verses.filter(v => v.v1Text !== '...' || v.v2Text !== '...');
            };

            const renderVerseText = (textObj, verConfig, verseData) => {
                 if (!textObj) return <span className="text-gray-400">尚未匯入</span>;
                 
                 const isOriginal = ['orig-wlc', 'orig-na28', 'orig-lxx'].includes(verConfig);
                 const isHebrew = verConfig === 'orig-wlc';
                 const isGreek = verConfig === 'orig-na28' || verConfig === 'orig-lxx';

                 let textClass = "text-base md:text-lg leading-relaxed ";
                 if (isHebrew) textClass += "hebrew-text text-xl md:text-2xl ";
                 else if (isGreek) textClass += "greek-text text-lg md:text-xl ";

                 if (isOriginal && verseData.original && verseData.original[verConfig]) {
                     const wordsArr = verseData.original[verConfig];
                     if (wordsArr.length > 0) {
                          return (
                              <div className={`${textClass} flex flex-wrap gap-x-2 gap-y-1 ${isHebrew ? 'justify-end' : ''}`}>
                                  {wordsArr.map((wObj, idx) => {
                                      const wordStr = typeof wObj === 'string' ? wObj : (wObj.word || wObj.text || '');
                                      return (
                                          <span 
                                              key={idx} 
                                              className="word-hover hover:text-blue-600 dark:hover:text-blue-400 transition-colors"
                                              onClick={() => handleWordClick(wordStr, verConfig, verseData, idx)}
                                              title="點擊查詢字典與文法"
                                          >
                                              {wordStr}
                                          </span>
                                      );
                                  })}
                              </div>
                          );
                     }
                 }

                 if (typeof textObj === 'string') {
                     return <div className={textClass}>{textObj}</div>;
                 }
                 
                 return <div className={textClass}>{JSON.stringify(textObj)}</div>;
            };

            if (!appReady) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 dark:bg-slate-900">
                        <div className="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                        <h2 className="text-xl font-bold text-slate-700 dark:text-slate-200 mb-2">啟動聖經研究環境</h2>
                        <p className="text-slate-500 dark:text-slate-400 mb-4">{loadingState.text}</p>
                        <div className="w-64 bg-slate-200 dark:bg-slate-700 rounded-full h-2">
                            <div className="bg-blue-600 h-2 rounded-full transition-all duration-300" 
                                 style={{ width: `${loadingState.total ? (loadingState.loaded / loadingState.total) * 100 : 0}%` }}>
                            </div>
                        </div>
                    </div>
                );
            }

            const chapterData = compileChapterData();
            const currentBook = [...BIBLE_STRUCTURE.OT, ...BIBLE_STRUCTURE.NT].find(b => b.id === currentVerse.bookId);

            return (
                <div className={`min-h-screen flex flex-col font-sans transition-colors duration-200 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200`}>
                    
                    {/* 頂部導覽列 */}
                    <header className="sticky top-0 z-20 flex flex-col md:flex-row items-center justify-between px-4 py-3 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm gap-4">
                        <div className="flex items-center w-full md:w-auto justify-between md:justify-start gap-4">
                            <button onClick={() => setSidebarOpen(!sidebarOpen)} className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg text-slate-600 dark:text-slate-300">
                                <lucide.Menu size={20} />
                            </button>
                            <h1 className="text-lg md:text-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent flex items-center gap-2">
                                <lucide.BookOpen size={24} className="text-blue-600" />
                                原文對照探索器
                            </h1>
                            <button onClick={() => setDarkMode(!darkMode)} className="p-2 md:hidden hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full">
                                {darkMode ? <lucide.Sun size={20} /> : <lucide.Moon size={20} />}
                            </button>
                        </div>
                        
                        <div className="flex flex-wrap items-center justify-center gap-2 w-full md:w-auto text-sm">
                            <div className="flex bg-slate-100 dark:bg-slate-800 rounded-lg p-1">
                                <button onClick={() => setLayoutMode('column')} className={`px-3 py-1.5 rounded-md flex items-center gap-1 ${layoutMode === 'column' ? 'bg-white dark:bg-slate-700 shadow-sm font-medium' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}>
                                    <lucide.Columns size={16} /> 欄位
                                </button>
                                <button onClick={() => setLayoutMode('row')} className={`px-3 py-1.5 rounded-md flex items-center gap-1 ${layoutMode === 'row' ? 'bg-white dark:bg-slate-700 shadow-sm font-medium' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}>
                                    <lucide.Rows size={16} /> 行列
                                </button>
                            </div>

                            {/* 版本選擇區塊 */}
                            <div className="flex items-center gap-2 bg-slate-50 dark:bg-slate-800 p-1.5 rounded-lg border border-slate-200 dark:border-slate-700">
                                <select value={version1} onChange={e => setVersion1(e.target.value)} className="bg-transparent border-none text-sm font-medium focus:ring-0 cursor-pointer dark:text-slate-200 max-w-[100px] md:max-w-[150px] truncate">
                                    <optgroup label="中文">
                                        <option value="cunp">和合本 (CUNP)</option>
                                        <option value="rcuv">和合本修訂版 (RCUV)</option>
                                        <option value="lzz">呂振中譯本 (LZZ)</option>
                                    </optgroup>
                                    <optgroup label="英文">
                                        <option value="kjv">KJV</option>
                                    </optgroup>
                                </select>
                                <span className="text-slate-300 dark:text-slate-600">|</span>
                                <select value={version2} onChange={e => setVersion2(e.target.value)} className="bg-transparent border-none text-sm font-medium focus:ring-0 cursor-pointer dark:text-slate-200 max-w-[100px] md:max-w-[150px] truncate text-blue-600 dark:text-blue-400">
                                    <optgroup label="中文/英文">
                                        <option value="cunp">和合本</option>
                                        <option value="kjv">KJV</option>
                                    </optgroup>
                                    <optgroup label="原文">
                                        {isOldTestament(currentVerse.bookId) ? (
                                            <>
                                                <option value="orig-wlc">WLC 希伯來文</option>
                                                <option value="orig-lxx">LXX 七十士譯本</option>
                                            </>
                                        ) : (
                                            <option value="orig-na28">NA28 希臘文</option>
                                        )}
                                    </optgroup>
                                </select>
                                <span className="text-slate-300 dark:text-slate-600">|</span>
                                <select value={version3} onChange={e => setVersion3(e.target.value)} className="bg-transparent border-none text-sm font-medium focus:ring-0 cursor-pointer dark:text-slate-200 max-w-[100px] md:max-w-[150px] truncate text-indigo-600 dark:text-indigo-400">
                                    <option value="none">無 (隱藏)</option>
                                    <optgroup label="中文/英文">
                                        <option value="kjv">KJV</option>
                                        <option value="lzz">呂振中</option>
                                    </optgroup>
                                    <optgroup label="原文">
                                        {isOldTestament(currentVerse.bookId) ? (
                                            <>
                                                <option value="orig-wlc">WLC 希伯來文</option>
                                                <option value="orig-lxx">LXX 七十士譯本</option>
                                            </>
                                        ) : (
                                            <option value="orig-na28">NA28 希臘文</option>
                                        )}
                                    </optgroup>
                                </select>
                            </div>
                            
                            <button onClick={() => setDarkMode(!darkMode)} className="hidden md:flex p-2 ml-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full text-slate-500 dark:text-slate-400">
                                {darkMode ? <lucide.Sun size={18} /> : <lucide.Moon size={18} />}
                            </button>
                        </div>
                    </header>

                    <div className="flex flex-1 overflow-hidden relative">
                        {/* 側邊欄 (章節選擇) */}
                        <aside className={`absolute md:relative z-10 w-72 h-full bg-slate-50/95 dark:bg-slate-800/95 backdrop-blur-xl border-r border-slate-200 dark:border-slate-700 flex flex-col transition-transform duration-300 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full md:hidden md:w-0 md:translate-x-0'} `} style={!sidebarOpen ? {display: 'none'} : {}}>
                            <div className="flex-1 overflow-y-auto p-4 custom-scrollbar">
                                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 px-2">舊約 Old Testament</h3>
                                <div className="grid grid-cols-4 gap-1 mb-6">
                                    {BIBLE_STRUCTURE.OT.map(book => (
                                        <button key={book.id} onClick={() => setCurrentVerse({ bookId: book.id, chapter: 1 })}
                                            className={`p-2 text-sm rounded-md transition-all ${currentVerse.bookId === book.id ? 'bg-blue-100 text-blue-700 font-bold dark:bg-blue-900 dark:text-blue-200' : 'hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300'}`}>
                                            {book.abbr}
                                        </button>
                                    ))}
                                </div>
                                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 px-2">新約 New Testament</h3>
                                <div className="grid grid-cols-4 gap-1">
                                    {BIBLE_STRUCTURE.NT.map(book => (
                                        <button key={book.id} onClick={() => setCurrentVerse({ bookId: book.id, chapter: 1 })}
                                            className={`p-2 text-sm rounded-md transition-all ${currentVerse.bookId === book.id ? 'bg-indigo-100 text-indigo-700 font-bold dark:bg-indigo-900 dark:text-indigo-200' : 'hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300'}`}>
                                            {book.abbr}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            
                            {currentBook && (
                                <div className="h-48 border-t border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 p-3 overflow-y-auto custom-scrollbar">
                                    <div className="text-sm font-bold text-center mb-2 text-slate-500">{currentBook.name}</div>
                                    <div className="flex flex-wrap gap-1 justify-center">
                                        {Array.from({ length: currentBook.chapters }, (_, i) => i + 1).map(ch => (
                                            <button key={ch} onClick={() => setCurrentVerse({ ...currentVerse, chapter: ch })}
                                                className={`w-8 h-8 flex items-center justify-center rounded-full text-sm font-medium transition-colors ${currentVerse.chapter === ch ? 'bg-blue-500 text-white shadow-md' : 'bg-slate-100 hover:bg-slate-200 text-slate-700 dark:bg-slate-800 dark:hover:bg-slate-700 dark:text-slate-300'}`}>
                                                {ch}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </aside>

                        {/* 主要經文區塊 */}
                        <main className="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar bg-white dark:bg-slate-900 relative">
                            <div className="max-w-5xl mx-auto pb-32">
                                <h2 className="text-2xl md:text-3xl font-extrabold text-center mb-8 pb-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-center gap-3">
                                    <span className="bg-clip-text text-transparent bg-gradient-to-r from-slate-700 to-slate-900 dark:from-slate-200 dark:to-white">
                                        {currentBook?.name} {currentVerse.chapter} 章
                                    </span>
                                </h2>
                                
                                <div className="space-y-6">
                                    {chapterData.map((verse) => (
                                        <div key={verse.verseNum} className="group relative bg-white dark:bg-slate-800/50 rounded-xl p-4 md:p-5 shadow-sm hover:shadow-md border border-slate-100 dark:border-slate-700/50 transition-all">
                                            <div className="absolute top-4 left-4 w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-sm font-bold text-slate-500 dark:text-slate-400 select-none">
                                                {verse.verseNum}
                                            </div>
                                            
                                            <div className={`pl-12 ${layoutMode === 'column' ? 'grid grid-cols-1 lg:grid-cols-2 gap-x-8 gap-y-4' : 'flex flex-col gap-4'}`}>
                                                {/* 對照 1 (主軸通常為中文) */}
                                                <div className="space-y-1">
                                                    <div className="text-xs font-bold text-slate-400 uppercase">{version1.toUpperCase()}</div>
                                                    {renderVerseText(verse.v1Text, version1, verse)}
                                                </div>
                                                
                                                {/* 對照 2 (通常為原文) */}
                                                <div className="space-y-1">
                                                    <div className="text-xs font-bold text-blue-400 uppercase">{version2.toUpperCase()}</div>
                                                    {renderVerseText(verse.v2Text, version2, verse)}
                                                </div>

                                                {/* 對照 3 (可選) */}
                                                {version3 !== 'none' && (
                                                    <div className={`space-y-1 ${layoutMode === 'column' ? 'lg:col-span-2 pt-4 border-t border-slate-100 dark:border-slate-700/50 mt-2' : ''}`}>
                                                        <div className="text-xs font-bold text-indigo-400 uppercase">{version3.toUpperCase()}</div>
                                                        {renderVerseText(verse.v3Text, version3, verse)}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </main>

                        {/* 字典與文法資訊浮動面板 (Slide-over) */}
                        {dictQuery && (
                            <div className="absolute right-0 top-0 h-full w-full md:w-96 bg-white dark:bg-slate-800 shadow-2xl border-l border-slate-200 dark:border-slate-700 z-30 flex flex-col transform transition-transform duration-300 ease-in-out overflow-hidden">
                                <div className="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-900">
                                    <h3 className="font-bold flex items-center gap-2 text-slate-700 dark:text-slate-200">
                                        <lucide.Library size={18} className="text-indigo-500" />
                                        原文分析與字典
                                    </h3>
                                    <button onClick={() => setDictQuery('')} className="p-1.5 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full text-slate-500 transition-colors">
                                        <lucide.X size={18} />
                                    </button>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto p-5 space-y-6 custom-scrollbar bg-slate-50/50 dark:bg-slate-800/50">
                                    <div className="bg-white dark:bg-slate-900 rounded-xl p-5 shadow-sm border border-slate-200 dark:border-slate-700 text-center relative overflow-hidden">
                                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-400 to-indigo-500"></div>
                                        <div className="text-xs font-bold text-slate-400 mb-2">{dictTarget.includes('hebrew') || dictTarget.includes('wlc') ? '希伯來文 Hebrew' : '希臘文 Greek'}</div>
                                        <div className={`text-4xl font-normal mb-3 ${dictTarget.includes('hebrew') || dictTarget.includes('wlc') ? 'hebrew-text text-blue-600 dark:text-blue-400' : 'greek-text text-indigo-600 dark:text-indigo-400'}`}>
                                            {dictContext?.originalWord || dictQuery}
                                        </div>
                                        {dictContext && (
                                            <div className="text-sm font-medium text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-800 py-1.5 px-3 rounded-full inline-flex items-center gap-2">
                                                <lucide.MapPin size={14} />
                                                {BIBLE_STRUCTURE.OT.concat(BIBLE_STRUCTURE.NT).find(b=>b.id===dictContext.bookId)?.name} {dictContext.chapter}:{dictContext.verseNum}
                                            </div>
                                        )}
                                    </div>

                                    {dictContext && dictContext.morphInfo && (
                                        <div className="bg-white dark:bg-slate-900 rounded-xl p-4 shadow-sm border border-slate-200 dark:border-slate-700">
                                            <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                                                <lucide.Tags size={14} /> 上下文語法結構
                                            </h4>
                                            <div className="flex flex-wrap gap-2">
                                                {parseMorphologyTags(dictContext.morphInfo).map((tag, i) => (
                                                    <span key={i} className="px-2.5 py-1 bg-indigo-50 text-indigo-700 dark:bg-indigo-900/50 dark:text-indigo-300 rounded-md text-xs font-medium border border-indigo-100 dark:border-indigo-800">
                                                        {tag}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    <div>
                                        <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 px-1 flex items-center gap-2">
                                            <lucide.Search size={14} /> 字典釋義
                                        </h4>
                                        <div className="space-y-3">
                                            {searchDictionary(dictQuery, dictTarget).map((r, idx) => (
                                                <div key={idx} className="bg-white dark:bg-slate-900 rounded-xl p-4 shadow-sm border border-slate-200 dark:border-slate-700 hover:border-blue-300 dark:hover:border-blue-700 transition-colors relative overflow-hidden">
                                                   {idx === 0 && <div className="absolute top-0 right-0 bg-blue-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-bl-lg">最佳匹配</div>}
                                                   
                                                   <div className="flex justify-between items-start mb-2">
                                                       <div>
                                                           <div className="font-bold text-lg text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                                               {r.lemma}
                                                               {r.isSynthesized && <span className="text-[10px] bg-amber-100 text-amber-700 dark:bg-amber-900 dark:text-amber-300 px-1.5 py-0.5 rounded uppercase">{r.source}</span>}
                                                           </div>
                                                           {r.transliteration && <div className="text-xs text-slate-500 dark:text-slate-400 italic mt-0.5">{r.transliteration}</div>}
                                                       </div>
                                                       <span className="text-xs font-mono bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-2 py-1 rounded border border-slate-200 dark:border-slate-700">
                                                           {r.strongs}
                                                       </span>
                                                   </div>
                                                   
                                                   <div className="mt-3 bg-slate-50 dark:bg-slate-800/50 rounded-lg p-3 border border-slate-100 dark:border-slate-700/50">
                                                      {r.strongs_definition && <p className="text-xs font-bold text-slate-700 dark:text-slate-300 leading-relaxed"><span className="text-slate-400 font-normal mr-1">定義:</span> {r.strongs_definition}</p>}
                                                      {r.definition && <div className="text-xs font-bold text-slate-700 dark:text-slate-300 leading-relaxed mt-1" dangerouslySetInnerHTML={{ __html: r.definition.includes('<span') ? r.definition : `<span class="text-slate-400 font-normal mr-1">定義:</span> ${r.definition}` }} />}
                                                      {r.derivation && r.derivation.toUpperCase() !== 'N/A' && r.derivation.toUpperCase() !== 'NONE' && <p className="text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed mt-1"><span className="font-normal mr-1">字源:</span> {r.derivation}</p>}
                                                      {r.kjv_definition && <p className="text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed mt-1"><span className="font-normal mr-1">KJV:</span> {r.kjv_definition}</p>}
                                                      {r.gloss && !r.strongs_definition && (!r.definition || r.isSynthesized) && <p className="text-xs font-bold text-slate-700 dark:text-slate-300 leading-relaxed mt-1"><span className="text-slate-400 font-normal mr-1">簡義:</span> {r.gloss}</p>}
                                                   </div>
                                                </div>
                                            ))}
                                            {searchDictionary(dictQuery, dictTarget).length === 0 && (
                                                <div className="text-center p-6 text-slate-500 text-sm border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-xl">
                                                    字典中查無此字或翻譯
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
